  <script>
    /* =========================================================================
     * 1. EMOTION MODES & SCHEMES (Identical to sim_pixel.c)
     * ========================================================================= */
    const MODES = [
      { id: 0,  name: "BOOT",      label: "🚀 Boot",      f: [0xffffff, 0xcfe0ff, 0x6fd8ff, 0x2b7de0], acc: 0x7ce8ff },
      { id: 1,  name: "IDLE",      label: "✨ Idle",      f: [0xfffbe0, 0xffe46b, 0x5ce1ff, 0x2a6bd9], acc: 0x6ae8ff },
      { id: 2,  name: "LISTENING", label: "👂 Listening", f: [0xe8faff, 0x8fdcff, 0x3fa2ff, 0x2a5bd7], acc: 0x5cb8ff, talky: true },
      { id: 3,  name: "THINKING",  label: "🤔 Thinking",  f: [0xffe6ff, 0xff9cf0, 0xd35bff, 0x7a2bd9], acc: 0xe07bff },
      { id: 4,  name: "SPEAKING",  label: "🗣️ Speaking",  f: [0xeafff4, 0x9ff5cf, 0x3fd9a0, 0x1f9a7a], acc: 0x6ff0bf, talky: true },
      { id: 5,  name: "ERROR",     label: "⚠️ Error",     f: [0xffd6d6, 0xff6b6b, 0xc7304a, 0x6b1a3a], acc: 0xff5c5c },
      { id: 6,  name: "OFF",       label: "👋 Off",       f: [0xd8d4ff, 0x8f86d9, 0x5a4fb0, 0x2e2870], acc: 0x7c72d0 },
      { id: 7,  name: "SLEEPY",    label: "😴 Sleepy",    f: [0xe0e8ff, 0x8ca0e8, 0x4858b0, 0x1e2660], acc: 0x7088e0 },
      { id: 8,  name: "LOVE",      label: "😍 Love",      f: [0xffe8f4, 0xff94c8, 0xf04898, 0x981858], acc: 0xff68b4 },
      { id: 9,  name: "ANGRY",     label: "💢 Angry",     f: [0xfff0d0, 0xff8830, 0xd82818, 0x700808], acc: 0xff4820 },
      { id: 10, name: "SURPRISED", label: "😲 Surprised", f: [0xffffff, 0xfff070, 0x40e8ff, 0x1880d0], acc: 0x90f4ff },
    ];

    const W = 64, H = 64, TAU = 6.2831853;
    const BAYER4 = [
      [0, 8, 2, 10],
      [12, 4, 14, 6],
      [3, 11, 1, 9],
      [15, 7, 13, 5]
    ];

    // Palette indices
    const C_BG=0, C_OUT=1, C_OUT2=2, C_BD=3, C_BM=4, C_BL=5, C_BH=6, C_RIM=7,
          C_SKIND=8, C_SKIN=9, C_SKINL=10, C_IRIS=11, C_IRIS_R=12, C_SHINE=13,
          C_BROW=14, C_BLUSH=15, C_BLUSHD=16, C_MOUTH=17, C_TONGUE=18,
          C_CYAN=19, C_CYAND=20, C_G0=21, C_G1=22, C_G2=23, C_G3=24,
          C_AURA1=25, C_AURA2=26, C_SPK=27, C_ACC=28, C_SHADOW=29, C_HEART=30, C_WHITE=31, C_COUNT=32;

    const M_NONE=0, M_TAIL=1, M_WING=2, M_GILL=3, M_BODY=4, M_FACE=5, M_EAR=6, M_ARM=7, M_FOOT=8;

    /* =========================================================================
     * 2. CREATURE DNA STATE
     * ========================================================================= */
    let dna = {
      seed: 4092,
      name: "Sternen-Hüter #4092",
      ears: 1,       // 0..7
      crown: 1,      // 0..4
      wings: 0,      // 0..2
      tail: 1,       // 0..3
      belly: 2,      // 0..5
      eyes: 0,       // 0..4
      mouth: 1,      // 0..3
      particle: 0,   // 0..2
      bodyHex: "#f26b38",
      skinHex: "#fff0dc",
      cyanHex: "#6cf8ec",
      irisHex: "#1cd4a8",
      blushHex: "#ff7898",
      bodyRx: 14.5,
      bodyRy: 18.5,
      headWiden: 0.16,
      neckPinch: 0.16,
      bellyBulge: 0.12
    };

    // Colour helpers
    function hexToRgb(hex) {
      const v = parseInt(hex.replace("#", ""), 16);
      return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
    }
    function rgbToHexInt(c) {
      const r = Math.max(0, Math.min(255, Math.round(c.r)));
      const g = Math.max(0, Math.min(255, Math.round(c.g)));
      const b = Math.max(0, Math.min(255, Math.round(c.b)));
      return (r << 16) | (g << 8) | b;
    }
    function mixRgb(a, b, t) {
      return { r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t };
    }
    function scaleRgb(a, k) {
      return { r: a.r * k, g: a.g * k, b: a.b * k };
    }
    function hexStr(n) {
      return "0x" + (n >>> 0).toString(16).padStart(6, "0");
    }

    function computeFixedPalette() {
      const base = hexToRgb(dna.bodyHex);
      const skin = hexToRgb(dna.skinHex);
      const cyan = hexToRgb(dna.cyanHex);
      const iris = hexToRgb(dna.irisHex);
      const blush = hexToRgb(dna.blushHex);
      const white = { r: 255, g: 255, b: 255 };
      const dark = { r: 24, g: 16, b: 38 };

      const fixed = new Array(C_COUNT).fill(0);
      fixed[C_BG]     = 0x000000;
      fixed[C_OUT]    = rgbToHexInt(mixRgb(dark, base, 0.22));
      fixed[C_OUT2]   = rgbToHexInt(mixRgb(base, cyan, 0.50));
      fixed[C_BD]     = rgbToHexInt(scaleRgb(base, 0.72));
      fixed[C_BM]     = rgbToHexInt(base);
      fixed[C_BL]     = rgbToHexInt(mixRgb(base, white, 0.26));
      fixed[C_BH]     = rgbToHexInt(mixRgb(base, white, 0.58));
      fixed[C_SKIND]  = rgbToHexInt(scaleRgb(skin, 0.84));
      fixed[C_SKIN]   = rgbToHexInt(skin);
      fixed[C_SKINL]  = rgbToHexInt(mixRgb(skin, white, 0.65));
      fixed[C_IRIS]   = 0x100c1c;
      fixed[C_IRIS_R] = rgbToHexInt(iris);
      fixed[C_SHINE]  = 0xffffff;
      fixed[C_BROW]   = rgbToHexInt(mixRgb(skin, cyan, 0.45));
      fixed[C_BLUSH]  = rgbToHexInt(blush);
      fixed[C_BLUSHD] = rgbToHexInt(scaleRgb(blush, 0.76));
      fixed[C_MOUTH]  = 0x381628;
      fixed[C_TONGUE] = 0xff6888;
      fixed[C_CYAN]   = rgbToHexInt(cyan);
      fixed[C_CYAND]  = rgbToHexInt(scaleRgb(cyan, 0.72));
      fixed[C_SHADOW] = 0x141024;
      fixed[C_HEART]  = 0xff4f8b;
      fixed[C_WHITE]  = 0xffffff;
      return fixed;
    }

    /* =========================================================================
     * 3. REAL-TIME 64x64 SOFTWARE RENDERER (Mirrors C code 1:1)
     * ========================================================================= */
    const fb = new Uint8Array(W * H);
    const mask = new Uint8Array(W * H);
    let currentMode = 1; // IDLE
    let t = 0, mode_t = 0, happy_t = -10;
    let s_scheme = [ {r:255,g:255,b:255}, {r:255,g:255,b:255}, {r:255,g:255,b:255}, {r:255,g:255,b:255}, {r:120,g:230,b:255} ];
    let eyes = { next_blink: 1.5, blink_start: -10, next_gaze: 1.0, gx: 0, gy: 0, tgx: 0, tgy: 0 };

    function px(x, y, c) {
      x = x | 0; y = y | 0;
      if (x >= 0 && x < W && y >= 0 && y < H) fb[y * W + x] = c;
    }
    function get_px(x, y) {
      x = x | 0; y = y | 0;
      return (x >= 0 && x < W && y >= 0 && y < H) ? fb[y * W + x] : C_BG;
    }
    function iround(v) { return Math.floor(v + 0.5); }
    function clampf(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function fracf(v) { return v - Math.floor(v); }
    function bayer(x, y) { return (BAYER4[y & 3][x & 3] + 0.5) / 16.0; }
    function hash16(x, y) {
      let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) >>> 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
      return (h ^ (h >>> 16)) & 0xffff;
    }
    function stamp(rows, x0, y0, fill, alt) {
      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        for (let c = 0; c < row.length; c++) {
          if (row[c] === '#') px(x0 + c, y0 + r, fill);
          else if (row[c] === 'o') px(x0 + c, y0 + r, alt);
        }
      }
    }

    function renderFrame(dt) {
      t += dt;
      mode_t += dt;

      const mObj = MODES[currentMode];
      const fixedHex = computeFixedPalette();
      const pal = fixedHex.map(c => ({ r: (c >> 16) & 255, g: (c >> 8) & 255, b: c & 255 }));

      const k = 1.0 - Math.exp(-dt * 7.0);
      for (let i = 0; i < 4; i++) {
        const tgt = { r: (mObj.f[i] >> 16) & 255, g: (mObj.f[i] >> 8) & 255, b: mObj.f[i] & 255 };
        s_scheme[i] = mixRgb(s_scheme[i], tgt, k);
      }
      const accTgt = { r: (mObj.acc >> 16) & 255, g: (mObj.acc >> 8) & 255, b: mObj.acc & 255 };
      s_scheme[4] = mixRgb(s_scheme[4], accTgt, k);

      const acc = s_scheme[4];
      pal[C_G0] = s_scheme[0];
      pal[C_G1] = s_scheme[1];
      pal[C_G2] = s_scheme[2];
      pal[C_G3] = s_scheme[3];
      pal[C_ACC] = acc;
      pal[C_RIM] = mixRgb(pal[C_CYAN], acc, 0.5);
      pal[C_AURA1] = scaleRgb(acc, 0.16);
      pal[C_AURA2] = scaleRgb(acc, 0.34);
      pal[C_SPK] = mixRgb(acc, pal[C_WHITE], 0.45);

      // Happiness & audio level
      const sincePet = t - happy_t;
      const happyLeft = 1.6 - sincePet;
      const happy = (sincePet >= 0 && happyLeft > 0) ? (happyLeft > 0.4 ? 1.0 : happyLeft / 0.4) : 0.0;

      const sliderVal = parseFloat(document.getElementById("rngLevel").value);
      let level = sliderVal;
      if (sliderVal === 0 && mObj.talky) {
        const syl = Math.abs(Math.sin(t * 6.3)) * (0.55 + 0.45 * Math.sin(t * 1.7 + 1.0));
        const gap = Math.sin(t * 0.9) > -0.6 ? 1.0 : 0.15;
        level = clampf(syl * gap, 0, 1);
      }

      // Eyes update
      if (t >= eyes.next_blink) {
        eyes.blink_start = t;
        eyes.next_blink = t + (Math.random() < 0.2 ? 0.28 : 2.2 + Math.random() * 3.0);
      }
      if (t >= eyes.next_gaze) {
        eyes.next_gaze = t + 1.2 + Math.random() * 2.4;
        if (Math.random() < 0.35) { eyes.tgx = 0; eyes.tgy = 0; }
        else { eyes.tgx = Math.random() * 2 - 1; eyes.tgy = (Math.random() * 2 - 1) * 0.6; }
      }
      let tgx = eyes.tgx, tgy = eyes.tgy;
      if (currentMode === 2 || currentMode === 10) { tgx = 0; tgy = 0; }
      else if (currentMode === 3) { tgx = 0.75 * Math.sin(mode_t * 1.3) + 0.25; tgy = -0.85; }
      else if (currentMode === 4) { tgx *= 0.3; tgy = 0; }
      else if (currentMode === 7) { tgx = 0; tgy = 0.4; }
      else if (currentMode === 9) { tgx = 0; tgy = -0.2; }
      const ek = 1.0 - Math.exp(-dt * 14.0);
      eyes.gx += (tgx - eyes.gx) * ek;
      eyes.gy += (tgy - eyes.gy) * ek;
      const bt = (t - eyes.blink_start) / 0.16;
      const blink = (bt < 0 || bt > 1) ? 0 : (1.0 - Math.abs(bt * 2 - 1));

      fb.fill(C_BG);
      mask.fill(M_NONE);

      const fade = currentMode === 6 ? clampf(1.0 - mode_t / 1.3, 0, 1) : 1.0;

      // Motion
      let bob = Math.sin(t * 1.8) * 1.0, breathe_rate = 2.0, lean = 0, hop = 0;
      let perk = 0.0, tail_speed = 2.8, wing_flap = Math.sin(t * 3.6) * 0.35;

      switch (currentMode) {
        case 2: bob = Math.sin(t * 3.0) * 0.6; perk = 0.85; tail_speed = 3.5; wing_flap = 0.55 + Math.sin(t * 5.0) * 0.2; break;
        case 3: bob = Math.sin(t * 2.4) * 0.8; lean = Math.sin(t * 1.3) * 1.2; perk = -0.25; tail_speed = 1.6; break;
        case 4: bob = Math.sin(t * 5.0) * 0.6 - level * 1.5; perk = 0.45 * Math.sin(t * 6.5); tail_speed = 4.8; wing_flap = Math.sin(t * 8.0) * (0.4 + level * 0.5); break;
        case 5: bob = 1.0; lean = Math.sin(t * 18.0) * (mode_t < 0.6 ? 1.0 : 0.0); perk = -0.9; tail_speed = 0.8; wing_flap = -0.8; break;
        case 7: breathe_rate = 0.9; bob = Math.sin(t * 0.9) * 1.2 + 1.5; lean = Math.sin(t * 0.6) * 1.0; perk = -0.8; tail_speed = 0.9; wing_flap = -0.75; break;
        case 8: bob = Math.sin(t * 3.5) * 0.8; lean = Math.sin(t * 2.5) * 1.8; perk = 0.65; tail_speed = 6.5; wing_flap = Math.sin(t * 12.0) * 0.75; break;
        case 9: bob = 1.2; lean = Math.sin(t * 28.0) * 0.8; perk = -0.65; tail_speed = 8.0; wing_flap = 0.9; break;
        case 10: hop = mode_t < 0.35 ? Math.sin((mode_t / 0.35) * Math.PI) * 6.0 : 0.0; bob = 0.0; perk = 1.0; tail_speed = 5.5; wing_flap = 1.0; break;
      }
      if (happy > 0) {
        hop = Math.abs(Math.sin(t * 9.0)) * 3.0 * happy;
        perk = 0.8;
        tail_speed = 7.5;
        wing_flap = Math.sin(t * 14.0) * 0.85;
      }

      const boot = currentMode === 0 ? clampf(mode_t / 1.4, 0, 1) : 1.0;
      const pop = currentMode === 0 ? clampf(mode_t / 0.6, 0, 1) : 1.0;
      const squash = 1.0 - (1.0 - pop) * 0.35 + Math.sin(pop * Math.PI) * 0.06;
      const breathe = Math.sin(t * breathe_rate + 1.0) * 0.03;

      const j = {
        a: dna.bodyRx * (1 + breathe) * (2.0 - squash) + level * 0.8,
        b: dna.bodyRy * (1 - breathe) * squash,
        cx: (dna.tail > 0 ? 30.8 : 32.0) + lean,
        cy: 0, fx: 0, fy: 0, fa: 0, fb: 7.3 * squash,
        t, perk, tail_speed, wing_flap
      };
      j.cy = 55.5 - j.b + bob * 0.5 - hop;
      j.fa = j.a * 0.76;
      j.fx = j.cx + lean * 0.3;
      j.fy = j.cy - j.b * 0.22 + bob * 0.3;

      // Aura
      const aura_r = 29.0 + level * 4.0 + Math.sin(t * 1.5);
      const aura_s = (0.75 * boot + level * 0.4) * fade;
      for (let y = Math.floor(j.cy - 3 - aura_r); y <= Math.ceil(j.cy - 3 + aura_r); y++) {
        for (let x = Math.floor(j.cx - aura_r); x <= Math.ceil(j.cx + aura_r); x++) {
          const dx = x + 0.5 - j.cx, dy = (y + 0.5 - (j.cy - 3)) * 1.1;
          const d = Math.sqrt(dx * dx + dy * dy) / aura_r;
          if (d >= 1.0) continue;
          const inten = (1.0 - d) * aura_s;
          const b = bayer(x, y);
          if (inten > 0.55 + b * 0.35) px(x, y, C_AURA2);
          else if (inten > b * 0.9) px(x, y, C_AURA1);
        }
      }

      // Rings
      if (currentMode === 2 || currentMode === 4) {
        const speed = currentMode === 2 ? 0.9 : 0.6;
        for (let k = 0; k < 2; k++) {
          const ph = fracf(t * speed + k * 0.5);
          const r = 20 + ph * 11;
          const rf = (1 - ph) * (0.35 + level);
          const n = Math.floor(r * 2.2);
          for (let i = 0; i < n; i++) {
            const ang = i * TAU / n;
            const rx = iround(j.cx + Math.cos(ang) * r);
            const ry = iround(j.fy + 2 + Math.sin(ang) * r * 0.92);
            if ((get_px(rx, ry) === C_BG || get_px(rx, ry) === C_AURA1) && bayer(rx, ry) < rf) {
              px(rx, ry, rf > 0.6 ? C_ACC : C_AURA2);
            }
          }
        }
      }

      // Shadow
      const sh_hw = 13.0 - hop * 0.8;
      for (let row = 0; row < 3; row++) {
        const hw = sh_hw * (row === 1 ? 1.0 : 0.72);
        for (let x = iround(j.cx - hw); x <= iround(j.cx + hw); x++) {
          if (bayer(x, 58 + row) > Math.abs(x + 0.5 - j.cx) / hw * 0.8) px(x, 58 + row, C_SHADOW);
        }
      }

      // Back sparkles
      const spk_speed = currentMode === 3 ? 2.8 : currentMode === 2 ? 1.2 : currentMode === 4 ? 1.5 : 0.6;
      const spk_count = currentMode === 0 ? Math.floor(boot * 6) : Math.floor(6 * fade);
      drawSparkles(j.cx, j.cy, false, spk_speed, spk_count);

      // Limbs setup
      const base = j.cy + j.b;
      const step = currentMode === 4 ? Math.sin(t * 5.0) * 0.6 : 0.0;
      const feet = [
        { x: j.cx - 5.8, y: base + 0.5 + (happy > 0 ? hop * 0.3 : step), angle: -0.15 },
        { x: j.cx + 5.8, y: base + 0.5 + (happy > 0 ? hop * 0.3 : -step), angle: 0.15 }
      ];
      const adx = j.a - 0.5, ay = j.cy + 3.0;
      let arms = [
        { x: j.cx - adx, y: ay, angle: -0.3 },
        { x: j.cx + adx, y: ay, angle: 0.3 }
      ];
      switch (currentMode) {
        case 2:
          arms = [ { x: j.cx - adx + 1.0, y: j.fy + 5.0, angle: 0.55 }, { x: j.cx + adx - 1.0, y: j.fy + 5.0, angle: -0.55 } ];
          break;
        case 3:
          arms = [ { x: j.cx - adx, y: ay, angle: -0.35 }, { x: j.cx + 7.5, y: j.fy + j.fb + 3.5, angle: -1.1 } ];
          break;
        case 6: {
          const w = Math.sin(t * 12.0) * 0.35 * fade;
          arms = [ { x: j.cx - adx, y: ay, angle: -0.3 }, { x: j.cx + adx + 1.0, y: j.cy - 4.0, angle: -2.3 - w } ];
          break;
        }
        case 4: {
          const w = Math.sin(t * 7.0) * (0.25 + level * 0.45);
          arms = [ { x: j.cx - adx, y: ay - 1.0, angle: -0.4 - w }, { x: j.cx + adx, y: ay - 1.0, angle: 0.4 - w } ];
          break;
        }
        case 8: {
          const w = Math.sin(t * 6.0) * 0.15;
          arms = [ { x: j.cx - adx + 2.0, y: j.fy + 6.5, angle: 0.75 + w }, { x: j.cx + adx - 2.0, y: j.fy + 6.5, angle: -0.75 - w } ];
          break;
        }
        case 9: {
          const w = Math.sin(t * 24.0) * 0.15;
          arms = [ { x: j.cx - adx - 1.0, y: ay - 1.5, angle: -0.85 + w }, { x: j.cx + adx + 1.0, y: ay - 1.5, angle: 0.85 - w } ];
          break;
        }
        case 10:
          arms = [ { x: j.cx - adx - 1.2, y: j.cy - 3.5, angle: 2.2 }, { x: j.cx + adx + 1.2, y: j.cy - 3.5, angle: -2.2 } ];
          break;
        default: {
          const sway = Math.sin(t * 1.8 + 0.6) * 0.08;
          if (happy > 0) {
            const wig = Math.sin(t * 14.0) * 0.25;
            arms = [ { x: j.cx - adx - 1.0, y: j.cy - 4.0, angle: 2.4 + wig }, { x: j.cx + adx + 1.0, y: j.cy - 4.0, angle: -2.4 - wig } ];
          } else {
            arms = [ { x: j.cx - adx, y: ay, angle: -0.3 + sway }, { x: j.cx + adx, y: ay, angle: 0.3 - sway } ];
          }
        }
      }

      // Avatar Raster Pass
      drawAvatar(j, arms, feet);

      // Face
      const eye_y = j.fy - 0.5;
      const eye_dx = 5.4;
      let style = "NORMAL";
      let open = 1.0 - blink;
      let mouth = "SMILE";
      let mouth_open = 0;

      switch (currentMode) {
        case 0: open = mode_t < 0.9 ? 0.0 : clampf((mode_t - 0.9) / 0.3, 0, 1); break;
        case 2: style = "WIDE"; mouth = "O"; break;
        case 3: open *= 0.85; mouth = "HMM"; break;
        case 4: mouth = "TALK"; mouth_open = level * 1.3 + 0.1 * (0.5 + 0.5 * Math.sin(t * 22.0)); break;
        case 5: style = "X"; mouth = "FLAT"; break;
        case 6: open = clampf((1.0 - mode_t / 1.0) * 1.5, 0, 1); mouth = "SMILE"; break;
        case 7: open *= 0.20; mouth = "O"; break;
        case 8: style = "HEART"; mouth = "GRIN"; break;
        case 9: style = "ANGRY"; open *= 0.85; mouth = "POUT"; break;
        case 10: style = "WIDE"; mouth = "O"; break;
      }
      if (happy > 0.2 && currentMode !== 5) {
        style = "HAPPY";
        mouth = "GRIN";
      }

      drawEye(j.fx - eye_dx, eye_y, open, style, eyes.gx, eyes.gy);
      drawEye(j.fx + eye_dx, eye_y, open, style, eyes.gx, eyes.gy);

      // Brows
      const bl = iround(j.fx - eye_dx), br = iround(j.fx + eye_dx);
      const by = iround(eye_y) - 6 - ((currentMode === 2 || currentMode === 10) ? 1 : 0);
      if (currentMode === 9) {
        px(bl - 1, by, C_BROW); px(bl, by + 1, C_BROW); px(bl + 1, by + 2, C_BROW);
        px(br - 1, by + 2, C_BROW); px(br, by + 1, C_BROW); px(br + 1, by, C_BROW);
      } else {
        const lift_r = currentMode === 3 ? -1 : 0;
        px(bl - 1, by, C_BROW); px(bl, by, C_BROW); px(bl + 1, by + 1, C_BROW);
        px(br - 1, by + 1 + lift_r, C_BROW); px(br, by + lift_r, C_BROW); px(br + 1, by + lift_r, C_BROW);
      }

      const blush = 0.60 + happy * 0.40 + (currentMode === 8 ? 0.35 : (currentMode === 4 ? 0.15 : 0.0));
      drawBlush(iround(j.fx - 9.5), iround(eye_y + 3), blush);
      drawBlush(iround(j.fx + 9.5), iround(eye_y + 3), blush);

      drawMouth(iround(j.fx), iround(eye_y + 5), mouth, mouth_open);

      // Foreground sparkles & effects
      drawSparkles(j.cx, j.cy, true, spk_speed, spk_count);

      const top = j.cy - j.b - 10.0;
      if (currentMode === 2 || currentMode === 4) drawWaves(j.cx, j.fy + 2, j.a, level);
      if (currentMode === 3) drawThoughtDots(j.cx + 14, top + 4);
      if (happy > 0 || currentMode === 8) drawHearts(j.cx, top + 2, currentMode === 8 ? 1.0 : happy);
      if (currentMode === 5 || (currentMode === 10 && mode_t < 0.8)) {
        stamp([".##.", ".##.", ".##.", ".##.", "....", ".##."], iround(j.cx + 16), iround(top + 2), C_ACC, C_ACC);
      }
      if (currentMode === 7) drawZzz(j.cx, top + 2);
      if (currentMode === 9) {
        const pulse = (Math.floor(t * 8.0) & 1);
        stamp([".#.#.", "##.##", ".....", "##.##", ".#.#."], iround(j.cx + 12), iround(top + 5) + pulse, C_HEART, C_ACC);
      }
      if (dna.particle === 1 && (currentMode === 1 || currentMode === 4)) {
        for (let i = 0; i < 2; i++) {
          const ph = fracf(t * 0.65 + i * 0.5);
          stamp([".##.", "#o.#", "#..#", ".##."], iround(j.cx + (i ? 16 : -19) + Math.sin(ph * TAU) * 2), iround(top + 8 - ph * 12), C_CYAN, C_WHITE);
        }
      } else if (dna.particle === 2 && currentMode === 4) {
        for (let i = 0; i < 2; i++) {
          const ph = fracf(t * 0.8 + i * 0.5);
          stamp(["..##", "..#.", "###.", "###."], iround(j.cx + (i ? 15 : -18) + Math.sin(ph * TAU) * 2), iround(top + 4 - ph * 9), i === 0 ? C_CYAN : C_ACC, C_WHITE);
        }
      }

      // Blit to Canvas
      blitToCanvas(pal);
    }

    function inLimb(l, rx, ry, px_x, px_y) {
      const dx = px_x - l.x, dy = px_y - l.y;
      const c = Math.cos(l.angle), s = Math.sin(l.angle);
      const u = (dx * c + dy * s) / rx;
      const v = (dy * c - dx * s) / ry;
      if (u * u + v * v <= 1.0) return { hit: true, u, v };
      return { hit: false, u: 0, v: 0 };
    }

    function shadeSkin(nx, ny, x, y, ox, oy, zone) {
      const r2 = nx * nx + ny * ny;
      const nz = r2 >= 1.0 ? 0.0 : Math.sqrt(1.0 - r2);
      const l = -0.38 * nx - 0.52 * ny + 0.78 * nz;
      const b = bayer(x, y);
      const rx = x - ox, ry = y - oy;

      if (zone === 1) { // Cream/Belly
        if (dna.belly === 3 && ((ry + 20) % 3 === 0) && b < 0.70) return C_SKIND;
        if (dna.belly === 4 && (((ry + (Math.abs(rx) & 1)) % 3) === 0) && ((Math.abs(rx) % 3) !== 0) && b < 0.65) return C_BM;
        const lv = l + (b - 0.5) * 0.22;
        return lv > 0.68 ? C_SKINL : lv > 0.25 ? C_SKIN : C_SKIND;
      }

      if (dna.belly === 5 && ny < -0.15 && ((hash16(rx, ry) & 0x3f) === 0)) {
        return C_CYAN;
      }

      const streak = ((hash16(rx, Math.floor((ry + (rx & 1) * 2) / 3)) >>> 4) / 4096.0) - 0.5;
      const lv = l + (b - 0.5) * 0.22 + streak * 0.18;

      if (dna.ears === 5 && r2 > 0.66) {
        const rim_str = (r2 - 0.66) * 2.4;
        if (rim_str > b) return rim_str > b + 0.35 ? C_CYAN : C_CYAND;
      }
      if (r2 > 0.80 && (nx * 0.6 + ny * 0.8) > 0.58 && b < 0.48) return C_RIM;
      if (dna.belly === 0 && r2 < 0.26 && ny > -0.2) {
        return (r2 < 0.12 && b < 0.65) ? C_SKINL : C_SKIN;
      }
      return lv > 0.86 ? C_BH : lv > 0.52 ? C_BL : lv > 0.20 ? C_BM : C_BD;
    }

    function checkEars(j, px_x, px_y, x, y) {
      const top_y = j.cy - j.b * 0.75;
      const dy = top_y - px_y;
      const side = px_x < j.cx ? -1 : 1;

      if (dna.ears === 1) { // Fox ears
        if (dy < -3.0 || dy > 14.5) return null;
        const h = 13.0;
        const droop_y = j.perk < 0 ? (-j.perk * 3.0 * Math.pow(clampf((dy + 2) / h, 0, 1), 2)) : 0;
        if (dy - droop_y > h - 1.5) return null;
        const eff_lt = clampf((dy + 2.0 - droop_y) / h, 0, 1);
        const splay = (2.8 - j.perk * 1.4) * eff_lt;
        const ear_cx = j.cx + side * (7.0 + splay + eff_lt * 2.2);
        const half_w = 4.6 * (1.0 - eff_lt * 0.84);
        const d = Math.abs(px_x - ear_cx);
        if (d <= half_w) {
          const u = d / (half_w + 0.01);
          if (eff_lt > 0.74) return { m: M_EAR, c: eff_lt > 0.86 ? C_CYAN : C_OUT };
          if (u < 0.52 && eff_lt > 0.12 && eff_lt < 0.70) return { m: M_EAR, c: C_BLUSH };
          return { m: M_EAR, c: side * (px_x - ear_cx) < 0 ? C_BL : C_BM };
        }
      } else if (dna.ears === 2) { // Dragon horns
        if (dy < -2.5 || dy > 12.5) return null;
        const h = 11.5;
        const lt = clampf((dy + 1.5) / h, 0, 1);
        if (dy > h - 1.0) return null;
        const curve = 6.2 + lt * 4.8 - Math.sin(lt * 2.8) * 1.6;
        const horn_cx = j.cx + side * curve;
        const half_w = 3.2 * (1.0 - lt * 0.80);
        if (Math.abs(px_x - horn_cx) <= half_w) {
          const ridge = (Math.floor(dy + 4.0) & 1) === 0;
          return { m: M_EAR, c: lt > 0.78 ? C_SKINL : (ridge ? C_SKIN : C_SKIND) };
        }
      } else if (dna.ears === 3) { // Axolotl gills
        const head_y = j.cy - j.b * 0.30;
        if (px_y < head_y - 14.0 || px_y > head_y + 7.0 || Math.abs(px_x - j.cx) < j.a * 0.72) return null;
        const GILLS = [
          { ay_off: -4.5, base_ang: 0.78, len: 9.2 },
          { ay_off: -1.2, base_ang: 0.28, len: 9.8 },
          { ay_off:  2.2, base_ang: -0.18, len: 8.2 }
        ];
        for (let g = 0; g < 3; g++) {
          const ax = j.cx + side * (j.a * 0.88 - (g === 0 ? 1.5 : 0.0));
          const ay = head_y + GILLS[g].ay_off;
          const wave = Math.sin(j.t * 3.0 + g * 1.1 + (side > 0 ? 0.5 : 0.0)) * 0.14;
          const ang = GILLS[g].base_ang + j.perk * 0.25 + wave;
          const rx = (px_x - ax) * side, ry = ay - px_y;
          const u = rx * Math.cos(ang) + ry * Math.sin(ang);
          const v = -rx * Math.sin(ang) + ry * Math.cos(ang);
          if (u < -1.0 || u > GILLS[g].len) continue;
          const lt = clampf(u / GILLS[g].len, 0, 1);
          const half_w = 2.0 * (1.0 - lt * 0.55) + 0.65 * Math.abs(Math.sin(u * 2.4));
          if (Math.abs(v) <= half_w) {
            return { m: M_GILL, c: lt > 0.76 ? C_CYAN : (Math.abs(v) > 1.0 ? C_BLUSH : C_BLUSHD) };
          }
        }
      } else if (dna.ears === 4) { // Owl tufts
        if (dy < -3.0 || dy > 11.0) return null;
        const h = 9.5;
        const droop = j.perk < 0 ? (-j.perk * 2.8) : 0;
        const eff_dy = dy + droop;
        if (eff_dy >= -2.0 && eff_dy <= h) {
          const lt = clampf((eff_dy + 1.5) / h, 0, 1);
          const splay = 6.5 + lt * (5.2 - j.perk * 1.5) + lt * lt * 1.6;
          const tuft_cx = j.cx + side * splay;
          const half_w = 3.6 * (1.0 - lt * 0.80);
          if (Math.abs(px_x - tuft_cx) <= half_w) {
            return { m: M_EAR, c: lt > 0.72 ? C_BROW : (lt > 0.38 ? C_BH : C_BL) };
          }
        }
      } else if (dna.ears === 5) { // Flame hair crest
        if (dy < -2.0 || dy > 13.5) return null;
        const t_norm = clampf(dy / 12.5, 0, 1);
        const sway = Math.sin(j.t * 3.2 + t_norm * 2.0) * 0.8 * t_norm;
        const dx = px_x - j.cx - sway;
        const LOCKS = [
          { ox: -1.2, curve: -3.8, w0: 4.8, h: 12.0 },
          { ox: -5.0, curve: -2.8, w0: 3.4, h: 8.5 },
          { ox:  3.5, curve: -1.8, w0: 3.2, h: 9.0 }
        ];
        for (let i = 0; i < 3; i++) {
          if (dy > LOCKS[i].h) continue;
          const lt = clampf(dy / LOCKS[i].h, 0, 1);
          const cx_lock = LOCKS[i].ox + LOCKS[i].curve * lt * lt + Math.sin(lt * 4.5 + i) * 0.7;
          const half_w = LOCKS[i].w0 * (1.0 - lt * 0.82);
          if (Math.abs(dx - cx_lock) <= half_w) {
            return { m: M_BODY, c: lt > 0.65 ? C_CYAN : (lt > 0.35 ? C_BH : C_BL) };
          }
        }
      } else if (dna.ears === 6) { // Lop bunny ears hanging down sides
        const ear_top = j.cy - j.b * 0.55;
        const edy = px_y - ear_top;
        if (edy >= 0 && edy <= 15.0) {
          const lt = edy / 15.0;
          const ecx = j.cx + side * (j.a * 0.88 + Math.sin(lt * 2.5) * 2.2 + j.perk * 1.2 * lt);
          const hw = 3.2 * Math.sin(lt * 2.6 + 0.3);
          if (Math.abs(px_x - ecx) <= hw) {
            return { m: M_EAR, c: lt > 0.78 ? C_CYAN : (Math.abs(px_x - ecx) < hw * 0.45 ? C_BLUSH : C_BM) };
          }
        }
      } else if (dna.ears === 7) { // Alien antennae
        if (dy >= -1.0 && dy <= 11.5) {
          const lt = clampf(dy / 10.0, 0, 1);
          const sway = Math.sin(j.t * 4.0 + side) * 1.2 * lt;
          const acx = j.cx + side * (5.5 + lt * 3.8) + sway;
          const dBulb = (px_x - acx) * (px_x - acx) + (dy - 9.5) * (dy - 9.5);
          if (dBulb <= 4.2) return { m: M_EAR, c: dBulb <= 1.5 ? C_WHITE : C_CYAN };
          if (dy < 9.5 && Math.abs(px_x - acx) <= 1.1) return { m: M_EAR, c: C_BL };
        }
      }
      return null;
    }

    function checkCrown(j, px_x, px_y) {
      const top_y = j.cy - j.b * 0.80;
      if (dna.crown === 2) { // Crescent moon
        const moon_y = top_y - 6.2 + Math.sin(j.t * 2.6) * 0.8;
        const mdx = px_x - j.cx, mdy = px_y - moon_y;
        const d_out = mdx * mdx + mdy * mdy;
        const d_in = (mdx - 1.3) * (mdx - 1.3) + (mdy + 1.1) * (mdy + 1.1);
        if (d_out <= 8.5 && d_in > 5.2) return { m: M_EAR, c: (mdy < 0 && mdx < 0) ? C_WHITE : C_CYAN };
      } else if (dna.crown === 3) { // Crystal spike
        const dy = top_y - px_y;
        if (dy >= -1.0 && dy <= 8.0) {
          const lt = clampf((dy + 1.0) / 9.0, 0, 1);
          if (Math.abs(px_x - j.cx) <= 2.6 * (1.0 - lt * 0.85)) {
            return { m: M_EAR, c: (lt > 0.55 || px_x < j.cx) ? C_CYAN : C_CYAND };
          }
        }
      } else if (dna.crown === 4) { // Halo ring
        const halo_y = top_y - 5.5 + Math.sin(j.t * 2.8) * 0.7;
        const dx = (px_x - j.cx) / 6.5, dy = (px_y - halo_y) / 2.2;
        const d = dx * dx + dy * dy;
        if (d >= 0.55 && d <= 1.35) return { m: M_EAR, c: C_CYAN };
      }
      return null;
    }

    function checkWings(j, px_x, px_y, x, y) {
      if (dna.wings === 0) return null;
      const sh_y = j.cy + 1.0;
      const dx_abs = Math.abs(px_x - j.cx);
      const start_x = j.a * 0.78;
      if (dx_abs < start_x - 1.0 || dx_abs > start_x + 12.5) return null;
      const wx = dx_abs - start_x;
      const wt = clampf(wx / 11.0, 0, 1);
      const flap_dy = j.wing_flap * 4.5 * wt;

      if (dna.wings === 1) { // Dragon bat wings
        const top_arch = sh_y - 4.0 - Math.sin(wt * 2.5) * 4.5 - flap_dy;
        const scallop = Math.abs(Math.sin(wt * Math.PI * 2.0)) * 2.2;
        const bot_arch = sh_y + 5.5 - wt * 2.0 - scallop - flap_dy * 0.7;
        if (px_y >= top_arch && px_y <= bot_arch) {
          return { m: M_WING, c: px_y <= top_arch + 1.8 ? C_BL : (bayer(x, y) < 0.45 ? C_BLUSHD : C_TONGUE) };
        }
      } else if (dna.wings === 2) { // Fairy wings
        const top_arch = sh_y - 6.0 - Math.sin(wt * 2.8) * 5.0 - flap_dy;
        const bot_arch = sh_y + 6.0 - Math.cos(wt * 1.5) * 3.0 - flap_dy * 0.5;
        if (px_y >= top_arch && px_y <= bot_arch) {
          return { m: M_WING, c: ((x + y) & 1) === 0 ? C_CYAN : C_SKINL };
        }
      }
      return null;
    }

    function checkTail(j, px_x, px_y, x, y) {
      if (dna.tail === 0) return null;
      const base_x = j.cx + j.a * 0.52;
      const base_y = j.cy + j.b * 0.58;
      const dx = px_x - base_x, dy = base_y - px_y;
      if (dx < -2.0 || dx > 16.5 || dy < -4.5 || dy > 18.0) return null;
      const wag = Math.sin(j.t * j.tail_speed) * 2.2;
      const t_est = clampf((dx * 0.66 + dy * 0.74) / 16.0, 0, 1);
      const cx_t = t_est * 11.5 + Math.sin(t_est * 3.1) * 2.0;
      const cy_t = t_est * t_est * 12.0 + wag * t_est;
      const dist2 = (dx - cx_t) * (dx - cx_t) + (dy - cy_t) * (dy - cy_t);

      if (dna.tail === 1) { // Fluffy fox tail
        const r = 5.2 * Math.sin(clampf(t_est * 2.6 + 0.25, 0, 3.05));
        if (dist2 <= r * r) {
          const b = bayer(x, y);
          if (t_est > 0.62 + (b - 0.5) * 0.14) {
            return { m: M_TAIL, c: (t_est > 0.84 && b < 0.5) ? C_CYAN : C_SKINL };
          }
          return { m: M_TAIL, c: dy > cy_t + 1.0 ? C_BL : C_BM };
        }
      } else if (dna.tail === 2) { // Dragon flame tail
        const r = t_est < 0.75 ? 3.8 * (1.0 - t_est * 0.65) : 3.6 * Math.sin((1.0 - t_est) * 2.0 * Math.PI + 0.2);
        if (dist2 <= r * r) {
          if (t_est > 0.72) return { m: M_TAIL, c: dist2 < r * r * 0.4 ? C_WHITE : C_CYAN };
          return { m: M_TAIL, c: dy > cy_t ? C_BL : C_BM };
        }
      } else if (dna.tail === 3) { // Axolotl fin tail
        const fin_r = 4.8 * Math.sin(t_est * Math.PI * 0.88 + 0.2);
        const core_r = 2.0 * (1.0 - t_est * 0.75);
        if (dist2 <= fin_r * fin_r) {
          return { m: M_TAIL, c: dist2 <= core_r * core_r ? C_BM : (((x + y) & 1) === 0 ? C_CYAN : C_BL) };
        }
      }
      return null;
    }

    function drawAvatar(j, arms, feet) {
      const ox = iround(j.cx), oy = iround(j.cy);
      for (let y = 0; y < H; y++) {
        const py = y + 0.5;
        const v = (py - j.cy) / j.b;
        const head_w = Math.exp(-(v + 0.22) * (v + 0.22) * 24.0) * dna.headWiden;
        const neck_p = Math.exp(-(v - 0.08) * (v - 0.08) * 18.0) * dna.neckPinch;
        const belly_b = v > 0.10 ? Math.sin(clampf((v - 0.10) * 1.85, 0, 1.57)) * dna.bellyBulge : 0.0;
        const row_a = j.a * (0.98 + head_w - neck_p + belly_b);
        const v_pow = Math.abs(v) <= 1.2 ? Math.pow(Math.abs(v), v < 0 ? 2.3 : 2.8) : 10.0;

        for (let x = 0; x < W; x++) {
          const px_x = x + 0.5;

          // 1. Arms
          let hitArm = false;
          for (let a = 0; a < 2; a++) {
            const res = inLimb(arms[a], 2.8, 5.2, px_x, py);
            if (res.hit) {
              mask[y * W + x] = M_ARM;
              const nx = res.u * 0.85 + (a ? 0.2 : -0.2);
              px(x, y, shadeSkin(nx, res.v * 0.8, x, y, ox, oy, 0));
              hitArm = true;
              break;
            }
          }
          if (hitArm) continue;

          // 2. Crown & Ears (except gills which go behind body edge)
          const cr = checkCrown(j, px_x, py);
          if (cr) { mask[y * W + x] = cr.m; px(x, y, cr.c); continue; }

          if (dna.ears !== 3) {
            const er = checkEars(j, px_x, py, x, y);
            if (er) { mask[y * W + x] = er.m; px(x, y, er.c); continue; }
          }

          // 3. Body
          const u = (px_x - j.cx) / row_a;
          const bf = Math.abs(u) <= 1.2 ? Math.pow(Math.abs(u), v < 0 ? 2.3 : 2.8) + v_pow : 10.0;
          const tuft = ((hash16(x - ox, y - oy) - 32768) / 32768.0) * 0.16;

          if (bf <= 1.0 + tuft) {
            let isCream = false;
            if (dna.belly === 1) { // Hoodie face panel
              const fu = (px_x - j.fx) / j.fa, fv = (py - j.fy) / j.fb;
              if (Math.pow(fu, 4) + Math.pow(fv, 4) <= 1.0) {
                mask[y * W + x] = M_FACE;
                px(x, y, fv < -0.55 ? C_SKIND : C_SKIN);
                continue;
              }
            } else if (dna.belly === 2) { // Fox cheek & bib
              const cheek = (v > -0.28 && v < 0.08 && Math.abs(u) < 0.78 && v > -0.05 - 0.22 * Math.cos(u * 3.5));
              const bib = (v >= 0.08 && v < 0.85 && Math.abs(u) < 0.52 * (1.0 - (v - 0.08) * 0.65));
              isCream = cheek || bib;
            } else if (dna.belly === 3 || dna.belly === 5) { // Belly patch
              isCream = (v >= 0.08 && v < 0.86 && Math.abs(u) < 0.55 * (1.0 - (v - 0.45) * (v - 0.45) * 0.9));
            } else if (dna.belly === 4) { // Owl double disc + breast
              const dl = (u + 0.30) * (u + 0.30) * 2.1 + (v + 0.22) * (v + 0.22) * 3.8;
              const dr = (u - 0.30) * (u - 0.30) * 2.1 + (v + 0.22) * (v + 0.22) * 3.8;
              const breast = (v >= 0.08 && v < 0.86 && Math.abs(u) < 0.58 * (1.0 - (v - 0.42) * (v - 0.42) * 1.1));
              isCream = (dl <= 0.42 || dr <= 0.42 || breast);
            }
            mask[y * W + x] = M_BODY;
            px(x, y, shadeSkin(u * 0.95, v * 0.95, x, y, ox, oy, isCream ? 1 : 0));
            continue;
          }

          // Axolotl gills
          if (dna.ears === 3) {
            const gr = checkEars(j, px_x, py, x, y);
            if (gr) { mask[y * W + x] = gr.m; px(x, y, gr.c); continue; }
          }

          // 4. Feet
          let hitFoot = false;
          for (let f = 0; f < 2; f++) {
            const res = inLimb(feet[f], 4.2, 2.6, px_x, py);
            if (res.hit) {
              mask[y * W + x] = M_FOOT;
              px(x, y, res.v < -0.15 ? C_BL : C_BD);
              hitFoot = true;
              break;
            }
          }
          if (hitFoot) continue;

          // 5. Wings & Tail
          const wr = checkWings(j, px_x, py, x, y);
          if (wr) { mask[y * W + x] = wr.m; px(x, y, wr.c); continue; }

          const tr = checkTail(j, px_x, py, x, y);
          if (tr) { mask[y * W + x] = tr.m; px(x, y, tr.c); }
        }
      }

      // Outline Pass
      const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const m = mask[y * W + x];
          if (m === M_NONE || m === M_FACE) continue;
          for (let k = 0; k < 4; k++) {
            const xx = x + N4[k][0], yy = y + N4[k][1];
            const n = (xx >= 0 && xx < W && yy >= 0 && yy < H) ? mask[yy * W + xx] : M_NONE;
            if (n === M_NONE || (m === M_ARM && (n === M_BODY || n === M_FACE)) || (m === M_BODY && n === M_FOOT)) {
              px(x, y, m === M_GILL ? C_OUT2 : C_OUT);
              break;
            }
          }
        }
      }

      // Forehead star gem (crown === 1)
      if (dna.crown === 1) {
        const gx = iround(j.fx);
        const gy = iround(j.cy - j.b - 2.0 + Math.sin(j.t * 3.0) * 0.6);
        px(gx, gy - 1, C_CYAN);
        px(gx - 1, gy, C_CYAN); px(gx, gy, C_WHITE); px(gx + 1, gy, C_CYAN);
        px(gx, gy + 1, C_CYAN);
      }
    }

    function drawEye(ex, ey, openness, style, gx, gy) {
      const cx = iround(ex), cy = iround(ey);
      if (style === "HAPPY") {
        stamp([".####.", "##..##", "#....#"], cx - 3, cy - 1, C_IRIS, C_IRIS);
        return;
      }
      if (style === "X") {
        stamp(["#...#", ".#.#.", "..#..", ".#.#.", "#...#"], cx - 2, cy - 2, C_IRIS, C_IRIS);
        return;
      }
      if (style === "HEART") {
        stamp([".##.##.", "#######", "#o#####", ".#####.", "..###..", "...#..."], cx - 3, cy - 3, C_HEART, C_WHITE);
        return;
      }
      if (openness < 0.25) {
        stamp([".####.", "#....#"], cx - 3, cy + 1, C_IRIS, C_IRIS);
        return;
      }

      if (dna.eyes === 4) { // Classic small bead eyes
        const b_cx = iround(ex + gx * 0.8), b_cy = iround(ey + gy * 0.7);
        stamp([".##.", "#o##", "####", ".##."], b_cx - 2, b_cy - 2, C_IRIS, C_SHINE);
        return;
      }

      const rx = dna.eyes === 3 ? 3 : 4;
      const ry = (style === "WIDE" ? rx + 1 : rx);
      const eff_ry = Math.max(1, iround(ry * clampf(openness, 0.3, 1.0)));
      const px_off = gx * 1.0, py_off = gy * 0.8;

      for (let dy = -eff_ry; dy <= eff_ry; dy++) {
        if (style === "ANGRY" && dy < -1) continue;
        for (let dx = -rx; dx <= rx; dx++) {
          const nd = (dx * dx) / (rx * rx + 0.5) + (dy * dy) / (eff_ry * eff_ry + 0.5);
          if (nd > 1.0) continue;
          const id_x = dx - px_off, id_y = dy - py_off;
          let col = C_WHITE;

          if (dna.eyes === 1) { // Dragon slit pupil
            const pupil_d = (id_x * id_x) * 1.8 + (id_y * id_y) * 0.55;
            const iris_d = id_x * id_x + id_y * id_y;
            if (pupil_d <= 3.2) col = C_IRIS;
            else if (iris_d <= 9.2) col = (dy > 0 && bayer(cx + dx, cy + dy) < 0.45) ? C_SKINL : C_IRIS_R;
          } else if (dna.eyes === 2) { // Owl large amber ring
            const id2 = id_x * id_x + id_y * id_y;
            col = nd > 0.82 ? C_OUT : (id2 <= 4.2 ? C_IRIS : C_IRIS_R);
          } else if (dna.eyes === 3) { // Axolotl dark bead + lower cyan crescent
            col = (dy > 0 && nd > 0.52 && bayer(cx + dx, cy + dy) < 0.65) ? C_IRIS_R : C_IRIS;
          } else { // Starry eyes (0)
            const id2 = id_x * id_x + id_y * id_y;
            if (id2 <= 3.6) col = C_IRIS;
            else if (id2 <= 8.5) col = (dy > 0 && bayer(cx + dx, cy + dy) < 0.45) ? C_CYAN : C_IRIS_R;
          }
          px(cx + dx, cy + dy, col);
        }
      }
      const sx = cx + iround(px_off * 0.5) - 1;
      const sy = cy + iround(py_off * 0.5) - 1;
      px(sx, sy, C_SHINE); px(sx - 1, sy, C_SHINE); px(sx, sy - 1, C_SHINE);
      if (eff_ry >= 3) px(sx + 2, sy + 2, C_CYAN);
    }

    function drawBlush(x, y, strength) {
      const CHEEK = [".##.", "####", ".##."];
      for (let j = 0; j < 3; j++) {
        for (let i = 0; i < 4; i++) {
          if (CHEEK[j][i] !== '#') continue;
          const b = bayer(x + i, y + j);
          if (b < strength) px(x - 2 + i, y + j, (j === 1 && b < strength * 0.5) ? C_BLUSHD : C_BLUSH);
        }
      }
    }

    function drawMouth(x, y, m, open) {
      if (dna.mouth === 3) { // Owl beak
        px(x, y - 2, C_CYAN);
        px(x - 1, y - 1, C_CYAND); px(x, y - 1, C_CYAN); px(x + 1, y - 1, C_CYAND);
        px(x, y, C_CYAND);
        if (m === "O" || m === "TALK" || m === "GRIN") {
          px(x - 1, y + 1, C_MOUTH); px(x, y + 1, C_TONGUE); px(x + 1, y + 1, C_MOUTH);
        }
        return;
      }

      if (dna.mouth === 1) { // Cute button nose
        px(x - 1, y - 2, C_MOUTH); px(x, y - 2, C_MOUTH); px(x + 1, y - 2, C_MOUTH);
        px(x, y - 1, C_MOUTH);
      } else if (dna.mouth === 2) { // Dragon nostrils
        px(x - 2, y - 2, C_MOUTH); px(x + 2, y - 2, C_MOUTH);
      }

      if (m === "SMILE") {
        if (dna.mouth === 1) stamp(["#.#.#", ".#.#."], x - 2, y, C_MOUTH, C_MOUTH);
        else if (dna.mouth === 2) stamp(["#....#", ".#o##."], x - 3, y, C_MOUTH, C_WHITE);
        else stamp(["#....#", "######", ".#oo#.", "..##.."], x - 3, y, C_MOUTH, C_TONGUE);
      } else if (m === "O") {
        stamp([".##.", "#oo#", ".##."], x - 2, y, C_MOUTH, C_TONGUE);
      } else if (m === "HMM") {
        stamp(["..#", "##."], x - 1, y + 1, C_MOUTH, C_MOUTH);
      } else if (m === "TALK") {
        const h = 2 + iround(clampf(open, 0, 1) * 3.0);
        const w = h > 2 ? 6 : 4;
        for (let j = 0; j < h; j++) {
          const inset = j === h - 1 ? 1 : 0;
          for (let i = inset; i < w - inset; i++) {
            const tongue = h >= 3 && j >= h - 2 && i > inset && i < w - inset - 1;
            px(x - (w >> 1) + i, y + j, tongue ? C_TONGUE : C_MOUTH);
          }
        }
      } else if (m === "GRIN") {
        stamp(["#######", ".##o##.", "..ooo..", "...#..."], x - 3, y, C_MOUTH, C_TONGUE);
      } else if (m === "FLAT") {
        stamp(["####"], x - 2, y + 1, C_MOUTH, C_MOUTH);
      } else if (m === "POUT") {
        stamp([".####.", "#....#"], x - 3, y + 1, C_MOUTH, C_MOUTH);
      }
    }

    function drawSparkles(cx, cy, front, speed, count) {
      for (let i = 0; i < count; i++) {
        const a = t * speed + i * TAU / count;
        const s = Math.sin(a);
        if ((s > 0) !== front) continue;
        const rr = 25.0 + 2.0 * Math.sin(i * 1.9 + t * 0.7);
        const x = iround(cx + Math.cos(a) * rr);
        const y = iround(cy - 3 + s * rr * 0.42);
        const tw = 0.5 + 0.5 * Math.sin(t * 5.0 + i * 1.7);
        const arm = front ? C_ACC : C_AURA2;
        const core = front ? C_WHITE : C_SPK;
        if (tw > 0.8) {
          px(x, y, core);
          for (let k = 1; k <= 2; k++) {
            const c = k === 1 ? (front ? C_SPK : arm) : arm;
            px(x + k, y, c); px(x - k, y, c); px(x, y + k, c); px(x, y - k, c);
          }
        } else if (tw > 0.45) {
          px(x, y, front ? C_SPK : arm);
          px(x + 1, y, arm); px(x - 1, y, arm); px(x, y + 1, arm); px(x, y - 1, arm);
        } else if (tw > 0.15) px(x, y, arm);
      }
    }

    function drawWaves(cx, cy, body_rx, level) {
      const n = Math.min(3, 1 + Math.floor(clampf(level, 0, 1) * 3.2));
      for (let k = 0; k < n; k++) {
        const r = body_rx + 5.0 + k * 3.0;
        const span = 2 + k;
        const flick = 0.5 + 0.5 * Math.sin(t * 12.0 - k * 1.4);
        for (let side = -1; side <= 1; side += 2) {
          for (let j = -span; j <= span; j++) {
            const xo = r - (j * j) / (2.0 * r) * 3.0;
            const x = iround(cx + side * xo), y = iround(cy - 2 + j);
            if (k === 0 || bayer(x, y) < 0.35 + flick * 0.65) {
              px(x, y, k === 0 ? C_ACC : (k === 1 ? C_G1 : C_G2));
            }
          }
        }
      }
    }

    function drawThoughtDots(x, y) {
      const active = Math.floor(fracf(t * 1.6) * 3.0);
      for (let i = 0; i < 3; i++) {
        const bx = iround(x + i * 4), by = iround(y - i * 3) - (i === active ? 1 : 0);
        const c = i === active ? C_G0 : C_ACC;
        px(bx, by, c); px(bx + 1, by, c); px(bx, by + 1, c); px(bx + 1, by + 1, i === active ? C_G1 : C_G2);
      }
    }

      const canvas = document.getElementById("previewCanvas");

      const imgData = ctx.createImageData(W * S, H * S);

        for (let x = 0; x < W * S; x++) {

static const uint8_t BAYER4[4][4] = {
    { 0, 8, 2, 10 }, { 12, 4, 14, 6 }, { 3, 11, 1, 9 }, { 15, 7, 13, 5 },
};

#define Q 12
#define ONE (1 << Q)
#define QF(v) ((int32_t)((v) * ONE))
#define POW_LUT_N 256
#define POW_LUT_MAX_Q QF(1.2f)
#define SQRT_LUT_N 1024
static int16_t s_pow_dome[POW_LUT_N + 1];
static int16_t s_pow_base[POW_LUT_N + 1];
static int16_t s_sqrt[SQRT_LUT_N + 1];

static void init_luts(void)
{
    for (int i = 0; i <= POW_LUT_N; i++) {
        float u = (float)i * POW_LUT_MAX_Q / POW_LUT_N / ONE;
        s_pow_dome[i] = (int16_t)(powf(u, 2.3f) * ONE);
        s_pow_base[i] = (int16_t)(powf(u, 2.8f) * ONE);
    }
    for (int i = 0; i <= SQRT_LUT_N; i++) {
        s_sqrt[i] = (int16_t)(sqrtf((float)i / SQRT_LUT_N) * ONE);
    }
}

static inline int32_t pow_q(const int16_t *lut, int32_t a) { return lut[(a * (POW_LUT_N * 65536 / POW_LUT_MAX_Q)) >> 16]; }
static inline int32_t sqrt_q(int32_t x) { return s_sqrt[x >> 2]; }
static inline int32_t bayer_q(int x, int y) { return BAYER4[y & 3][x & 3] * (ONE / 16) + ONE / 32; }
static inline float bayer(int x, int y) { return (BAYER4[y & 3][x & 3] + 0.5f) / 16.0f; }
static inline rgb_t hex_rgb(uint32_t c) { return (rgb_t){ (float)((c >> 16) & 0xff), (float)((c >> 8) & 0xff), (float)(c & 0xff) }; }
static inline rgb_t mix(rgb_t a, rgb_t b, float t) { return (rgb_t){ a.r + (b.r - a.r) * t, a.g + (b.g - a.g) * t, a.b + (b.b - a.b) * t }; }
static inline rgb_t scale_rgb(rgb_t a, float k) { return (rgb_t){ a.r * k, a.g * k, a.b * k }; }

static inline uint16_t to565(rgb_t c)
{
    int r = (int)(c.r + 0.5f), g = (int)(c.g + 0.5f), b = (int)(c.b + 0.5f);
    r = r < 0 ? 0 : (r > 255 ? 255 : r);
    g = g < 0 ? 0 : (g > 255 ? 255 : g);
    b = b < 0 ? 0 : (b > 255 ? 255 : b);
    return (uint16_t)(((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3));
}

uint32_t sim_pixel_accent(sim_mode_t mode)
