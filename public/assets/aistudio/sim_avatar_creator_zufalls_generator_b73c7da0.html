static void update_palette(const scheme_t *target, float dt)
{
    rgb_t tgt[5];
    for (int i = 0; i < 4; i++) tgt[i] = hex_rgb(target->f[i]);
    tgt[4] = hex_rgb(target->acc);
    float k = s_scheme_init ? 1.0f - expf(-dt * 7.0f) : 1.0f;
    for (int i = 0; i < 5; i++) s_scheme[i] = mix(s_scheme[i], tgt[i], k);
    s_scheme_init = true;

    rgb_t pal[C_COUNT];
    for (int i = 0; i < C_COUNT; i++) pal[i] = hex_rgb(FIXED[i]);
    rgb_t acc = s_scheme[4];
    pal[C_G0] = s_scheme[0]; pal[C_G1] = s_scheme[1]; pal[C_G2] = s_scheme[2]; pal[C_G3] = s_scheme[3];
    pal[C_ACC] = acc;
    pal[C_RIM] = mix(pal[C_CYAN], acc, 0.5f);
    pal[C_AURA1] = scale_rgb(acc, 0.16f);
    pal[C_AURA2] = scale_rgb(acc, 0.34f);
    pal[C_SPK] = mix(acc, pal[C_WHITE], 0.45f);
    for (int i = 0; i < C_COUNT; i++) {
        s_pal[i] = to565(pal[i]);
        s_pal_dim[i] = to565(scale_rgb(pal[i], 0.72f));
    }
}

static inline void px(int x, int y, uint8_t c) { if ((unsigned)x < W && (unsigned)y < H) s_fb[y * W + x] = c; }
static inline uint8_t get_px(int x, int y) { return ((unsigned)x < W && (unsigned)y < H) ? s_fb[y * W + x] : C_BG; }
static inline int iround(float v) { return (int)floorf(v + 0.5f); }
static inline float clampf(float v, float lo, float hi) { return v < lo ? lo : (v > hi ? hi : v); }
static inline float fracf(float v) { return v - floorf(v); }

static uint32_t s_rng = 0x9e3779b9u;
static float frand(void) { s_rng ^= s_rng << 13; s_rng ^= s_rng >> 17; s_rng ^= s_rng << 5; return (float)(s_rng & 0xffffff) / (float)0x1000000; }

static void stamp(const char *const *rows, int nrows, int x0, int y0, uint8_t fill, uint8_t alt)
{
    for (int r = 0; r < nrows; r++) {
        for (int c = 0; rows[r][c]; c++) {
            if (rows[r][c] == '#') px(x0 + c, y0 + r, fill);
            else if (rows[r][c] == 'o') px(x0 + c, y0 + r, alt);
        }
    }
}

typedef struct { float next_blink, blink_start, next_gaze, gx, gy, tgx, tgy, last_t; } eyes_t;
static eyes_t s_eyes = { .next_blink = 1.5f, .blink_start = -10, .next_gaze = 1.0f };

static float eyes_update(const sim_pose_t *p, float dt)
{
    eyes_t *e = &s_eyes;
    if (p->t >= e->next_blink) {
        e->blink_start = p->t;
        e->next_blink = p->t + (frand() < 0.2f ? 0.28f : 2.2f + frand() * 3.0f);
    }
    if (p->t >= e->next_gaze) {
        e->next_gaze = p->t + 1.2f + frand() * 2.4f;
        if (frand() < 0.35f) { e->tgx = 0; e->tgy = 0; }
        else { e->tgx = frand() * 2 - 1; e->tgy = (frand() * 2 - 1) * 0.6f; }
    }
    float tgx = e->tgx, tgy = e->tgy;
    switch (p->mode) {
    case SIM_MODE_LISTENING: case SIM_MODE_SURPRISED: tgx = 0; tgy = 0.0f; break;
    case SIM_MODE_THINKING: tgx = 0.75f * sinf(p->mode_t * 1.3f) + 0.25f; tgy = -0.85f; break;
    case SIM_MODE_SPEAKING: tgx *= 0.3f; tgy = 0; break;
    case SIM_MODE_SLEEPY: tgx = 0; tgy = 0.4f; break;
    case SIM_MODE_ANGRY: tgx = 0; tgy = -0.2f; break;
    default: break;
    }
    float k = 1.0f - expf(-dt * 14.0f);
    e->gx += (tgx - e->gx) * k; e->gy += (tgy - e->gy) * k;
    float bt = (p->t - e->blink_start) / 0.16f;
    return (bt < 0 || bt > 1) ? 0 : (1.0f - fabsf(bt * 2 - 1));
}

static void draw_aura(float cx, float cy, float radius, float strength)
{
    int x0 = (int)(cx - radius - 1), x1 = (int)(cx + radius + 1);
    int y0 = (int)(cy - radius - 1), y1 = (int)(cy + radius + 1);
    int32_t cx16 = (int32_t)(cx * 16), r2 = (int32_t)(radius * radius * 256);
    int32_t to_idx = (int32_t)((float)SQRT_LUT_N * 65536 / r2);
    int32_t str = QF(strength);
    for (int y = y0; y <= y1; y++) {
        int32_t dy = (int32_t)((y + 0.5f - cy) * 1.1f * 16);
        int32_t dy2 = dy * dy;
        if (dy2 >= r2) continue;
        for (int x = x0; x <= x1; x++) {
            int32_t dx = x * 16 + 8 - cx16;
            int32_t d2 = dx * dx + dy2;
            if (d2 >= r2) continue;
            int32_t i = ((ONE - s_sqrt[(d2 * to_idx) >> 16]) * str) >> Q;
            int32_t b = bayer_q(x, y);
            if (i > QF(0.55f) + ((b * QF(0.35f)) >> Q)) px(x, y, C_AURA2);
            else if (i > (b * QF(0.9f)) >> Q) px(x, y, C_AURA1);
        }
    }
}

static void draw_rings(float cx, float cy, float t, float level, float speed)
{
    for (int k = 0; k < 2; k++) {
        float ph = fracf(t * speed + k * 0.5f);
        float r = 20 + ph * 11;
        float fade = (1 - ph) * (0.35f + level);
        int n = (int)(r * 2.2f);
        for (int i = 0; i < n; i++) {
            float a = i * TAU / n;
            int x = iround(cx + cosf(a) * r), y = iround(cy + sinf(a) * r * 0.92f);
            if ((get_px(x, y) == C_BG || get_px(x, y) == C_AURA1) && bayer(x, y) < fade)
                px(x, y, fade > 0.6f ? C_ACC : C_AURA2);
        }
    }
}

static void draw_shadow(float cx, float y, float half_w)
{
    for (int row = 0; row < 3; row++) {
        float hw = half_w * (row == 1 ? 1.0f : 0.72f);
        for (int x = iround(cx - hw); x <= iround(cx + hw); x++) {
            if (bayer(x, (int)y + row) > fabsf(x + 0.5f - cx) / hw * 0.8f)
                px(x, (int)y + row, C_SHADOW);
        }
    }
}

static inline int32_t hash16(int x, int y)
{
    uint32_t h = (uint32_t)x * 374761393u + (uint32_t)y * 668265263u;
    h = (h ^ (h >> 13)) * 1274126177u;
    return (int32_t)((h ^ (h >> 16)) & 0xffff);
}

typedef struct {
    float cx, cy, a, b, fx, fy, fa, fb, t, perk, tail_speed, wing_flap;
} avatar_t;

typedef struct { int32_t v, inv_a; const int16_t *lut; bool body; int32_t v_pow; } row_t;

static inline void row_setup(const avatar_t *j, float y, row_t *r)
{
    float v = (y - j->cy) / j->b;
    float hw = expf(-(v + 0.22f) * (v + 0.22f) * 24.0f) * DNA_HEAD_W;
    float np = expf(-(v - 0.08f) * (v - 0.08f) * 18.0f) * DNA_NECK_P;
    float bb = v > 0.10f ? sinf(clampf((v - 0.10f) * 1.85f, 0, 1.57f)) * DNA_BELLY_B : 0.0f;
    float a = j->a * (0.98f + hw - np + bb);
    r->v = QF(v);
    r->inv_a = QF(1.0f / a);
    r->lut = v < 0 ? s_pow_dome : s_pow_base;
    r->body = abs(r->v) <= POW_LUT_MAX_Q;
    r->v_pow = r->body ? pow_q(r->lut, abs(r->v)) : 0;
}

static inline int32_t body_field(const row_t *r, int32_t dx, int32_t *ux)
{
    int32_t u = (dx * r->inv_a) >> Q;
    *ux = u;
    if (!r->body || abs(u) > POW_LUT_MAX_Q) return 2 * ONE;
    return pow_q(r->lut, abs(u)) + r->v_pow;
}

static uint8_t shade_skin(int32_t nx, int32_t ny, int x, int y, int ox, int oy, bool is_cream)
{
    int32_t r2 = (nx * nx + ny * ny) >> Q;
    int32_t nz = r2 >= ONE ? 0 : sqrt_q(ONE - r2);
    int32_t l = (-QF(0.38f) * nx - QF(0.52f) * ny + QF(0.78f) * nz) >> Q;
    int32_t b = bayer_q(x, y);
    int rx = x - ox, ry = y - oy;

    if (is_cream) {
#if DNA_BELLY == 3
        if (((ry + 20) % 3) == 0 && b < QF(0.70f)) return C_SKIND;
#elif DNA_BELLY == 4
        if ((((ry + (abs(rx) & 1)) % 3) == 0) && ((abs(rx) % 3) != 0) && b < QF(0.65f)) return C_BM;
#endif
        int32_t lv = l + (((b - ONE / 2) * QF(0.22f)) >> Q);
        return lv > QF(0.68f) ? C_SKINL : lv > QF(0.25f) ? C_SKIN : C_SKIND;
    }
#if DNA_BELLY == 5
    if (ny < -QF(0.15f) && ((hash16(rx, ry) & 0x3f) == 0)) return C_CYAN;
#endif
    int32_t streak = (hash16(rx, (ry + (rx & 1) * 2) / 3) >> 4) - ONE / 2;
    int32_t lv = l + (((b - ONE / 2) * QF(0.22f)) >> Q) + ((streak * QF(0.18f)) >> Q);
    if (r2 > QF(0.80f) && ((nx * QF(0.6f) + ny * QF(0.8f)) >> Q) > QF(0.58f) && b < QF(0.48f)) return C_RIM;
#if DNA_BELLY == 0
    if (r2 < QF(0.26f) && ny > -QF(0.2f)) return (r2 < QF(0.12f) && b < QF(0.65f)) ? C_SKINL : C_SKIN;
#endif
    return lv > QF(0.86f) ? C_BH : lv > QF(0.52f) ? C_BL : lv > QF(0.20f) ? C_BM : C_BD;
}

typedef struct { float x, y, angle; } limb_t;
typedef struct { int32_t x, y, c, s, inv_rx, inv_ry, r; } limb_q_t;

static void limb_setup(const limb_t *l, float rx, float ry, limb_q_t *q)
{
    q->x = QF(l->x); q->y = QF(l->y);
    q->c = QF(cosf(l->angle)); q->s = QF(sinf(l->angle));
    q->inv_rx = QF(1.0f / rx); q->inv_ry = QF(1.0f / ry);
    q->r = QF(rx > ry ? rx : ry);
}

static inline bool in_limb(const limb_q_t *l, int32_t x, int32_t y, int32_t *lx, int32_t *ly)
{
    int32_t dx = x - l->x, dy = y - l->y;
    if (abs(dx) > l->r || abs(dy) > l->r) return false;
    int32_t u = ((((dx * l->c) >> Q) + ((dy * l->s) >> Q)) * l->inv_rx) >> Q;
    int32_t v = ((((dy * l->c) >> Q) - ((dx * l->s) >> Q)) * l->inv_ry) >> Q;
    *lx = u; *ly = v;
    return u * u + v * v <= ONE * ONE;
}

enum { M_NONE, M_TAIL, M_WING, M_GILL, M_BODY, M_FACE, M_EAR, M_ARM, M_FOOT };

static bool check_crown(const avatar_t *j, float px_x, float px_y, uint8_t *col)
{
#if DNA_CROWN == 2
    float top_y = j->cy - j->b * 0.80f;
    float moon_y = top_y - 6.2f + sinf(j->t * 2.6f) * 0.8f;
    float mdx = px_x - j->cx, mdy = px_y - moon_y;
    if (mdx * mdx + mdy * mdy <= 8.5f && (mdx - 1.3f) * (mdx - 1.3f) + (mdy + 1.1f) * (mdy + 1.1f) > 5.2f) {
        *col = (mdy < 0 && mdx < 0) ? C_WHITE : C_CYAN;
        return true;
    }
#elif DNA_CROWN == 3
    float dy = (j->cy - j->b * 0.80f) - px_y;
    if (dy >= -1.0f && dy <= 8.0f) {
        float lt = clampf((dy + 1.0f) / 9.0f, 0.0f, 1.0f);
        if (fabsf(px_x - j->cx) <= 2.6f * (1.0f - lt * 0.85f)) {
            *col = (lt > 0.55f || px_x < j->cx) ? C_CYAN : C_CYAND;
            return true;
        }
    }
#elif DNA_CROWN == 4
    float halo_y = (j->cy - j->b * 0.80f) - 5.5f + sinf(j->t * 2.8f) * 0.7f;
    float dx = (px_x - j->cx) / 6.5f, dy = (px_y - halo_y) / 2.2f;
    float d = dx * dx + dy * dy;
    if (d >= 0.55f && d <= 1.35f) { *col = C_CYAN; return true; }
#endif
    (void)j; (void)px_x; (void)px_y; (void)col;
    return false;
}

static bool check_ears(const avatar_t *j, float px_x, float px_y, uint8_t *col, int x, int y)
{
    float top_y = j->cy - j->b * 0.75f;
    float dy = top_y - px_y;
    float side = px_x < j->cx ? -1.0f : 1.0f;
    (void)dy; (void)side; (void)x; (void)y;
#if DNA_EARS == 1
    if (dy < -3.0f || dy > 14.5f) return false;
    float h = 13.0f;
    float lt0 = clampf((dy + 2.0f) / h, 0.0f, 1.0f);
    float droop_y = j->perk < 0 ? (-j->perk * 3.0f * lt0 * lt0) : 0.0f;
    if (dy - droop_y > h - 1.5f) return false;
    float eff_lt = clampf((dy + 2.0f - droop_y) / h, 0.0f, 1.0f);
    float ear_cx = j->cx + side * (7.0f + (2.8f - j->perk * 1.4f) * eff_lt + eff_lt * 2.2f);
    float half_w = 4.6f * (1.0f - eff_lt * 0.84f);
    float d = fabsf(px_x - ear_cx);
    if (d <= half_w) {
        if (eff_lt > 0.74f) *col = eff_lt > 0.86f ? C_CYAN : C_OUT;
        else if (d / (half_w + 0.01f) < 0.52f && eff_lt > 0.12f && eff_lt < 0.70f) *col = C_BLUSH;
        else *col = (side * (px_x - ear_cx) < 0) ? C_BL : C_BM;
        return true;
    }
#elif DNA_EARS == 2
    if (dy < -2.5f || dy > 11.5f) return false;
    float lt = clampf((dy + 1.5f) / 11.5f, 0.0f, 1.0f);
    float horn_cx = j->cx + side * (6.2f + lt * 4.8f - sinf(lt * 2.8f) * 1.6f);
    if (fabsf(px_x - horn_cx) <= 3.2f * (1.0f - lt * 0.80f)) {
        *col = lt > 0.78f ? C_SKINL : ((((int)(dy + 4.0f)) & 1) == 0 ? C_SKIN : C_SKIND);
        return true;
    }
#elif DNA_EARS == 3
    float head_y = j->cy - j->b * 0.30f;
    if (px_y < head_y - 14.0f || px_y > head_y + 7.0f || fabsf(px_x - j->cx) < j->a * 0.72f) return false;
    static const struct { float ay_off, base_ang, len; } GILLS[3] = {
        { -4.5f, 0.78f, 9.2f }, { -1.2f, 0.28f, 9.8f }, { 2.2f, -0.18f, 8.2f }
    };
    for (int g = 0; g < 3; g++) {
        float ax = j->cx + side * (j->a * 0.88f - (g == 0 ? 1.5f : 0.0f));
        float ay = head_y + GILLS[g].ay_off;
        float ang = GILLS[g].base_ang + j->perk * 0.25f + sinf(j->t * 3.0f + g * 1.1f + (side > 0 ? 0.5f : 0.0f)) * 0.14f;
        float rx = (px_x - ax) * side, ry = ay - px_y;
        float u = rx * cosf(ang) + ry * sinf(ang);
        float v = -rx * sinf(ang) + ry * cosf(ang);
        if (u < -1.0f || u > GILLS[g].len) continue;
        float lt = clampf(u / GILLS[g].len, 0.0f, 1.0f);
        if (fabsf(v) <= 2.0f * (1.0f - lt * 0.55f) + 0.65f * fabsf(sinf(u * 2.4f))) {
            *col = lt > 0.76f ? C_CYAN : (fabsf(v) > 1.0f ? C_BLUSH : C_BLUSHD);
            return true;
        }
    }
#elif DNA_EARS == 4
    if (dy < -3.0f || dy > 11.0f) return false;
    float eff_dy = dy + (j->perk < 0 ? -j->perk * 2.8f : 0.0f);
    if (eff_dy >= -2.0f && eff_dy <= 9.5f) {
        float lt = clampf((eff_dy + 1.5f) / 9.5f, 0.0f, 1.0f);
        float tuft_cx = j->cx + side * (6.5f + lt * (5.2f - j->perk * 1.5f) + lt * lt * 1.6f);
        if (fabsf(px_x - tuft_cx) <= 3.6f * (1.0f - lt * 0.80f)) {
            *col = lt > 0.72f ? C_BROW : (lt > 0.38f ? C_BH : C_BL);
            return true;
        }
    }
#elif DNA_EARS == 5
    if (dy < -2.0f || dy > 13.5f) return false;
    float t_norm = clampf(dy / 12.5f, 0.0f, 1.0f);
    float dx = px_x - j->cx - sinf(j->t * 3.2f + t_norm * 2.0f) * 0.8f * t_norm;
    static const struct { float ox, curve, w0, h; } LOCKS[3] = {
        { -1.2f, -3.8f, 4.8f, 12.0f }, { -5.0f, -2.8f, 3.4f, 8.5f }, { 3.5f, -1.8f, 3.2f, 9.0f }
    };
    for (int i = 0; i < 3; i++) {
        if (dy > LOCKS[i].h) continue;
        float lt = clampf(dy / LOCKS[i].h, 0.0f, 1.0f);
        float cx_lock = LOCKS[i].ox + LOCKS[i].curve * lt * lt + sinf(lt * 4.5f + i) * 0.7f;
        if (fabsf(dx - cx_lock) <= LOCKS[i].w0 * (1.0f - lt * 0.82f)) {
            *col = lt > 0.65f ? C_CYAN : (lt > 0.35f ? C_BH : C_BL);
            return true;
        }
    }
#elif DNA_EARS == 6
    float edy = px_y - (j->cy - j->b * 0.55f);
    if (edy >= 0.0f && edy <= 15.0f) {
        float lt = edy / 15.0f;
        float ecx = j->cx + side * (j->a * 0.88f + sinf(lt * 2.5f) * 2.2f + j->perk * 1.2f * lt);
        float hw = 3.2f * sinf(lt * 2.6f + 0.3f);
        if (fabsf(px_x - ecx) <= hw) {
            *col = lt > 0.78f ? C_CYAN : (fabsf(px_x - ecx) < hw * 0.45f ? C_BLUSH : C_BM);
            return true;
        }
    }
#elif DNA_EARS == 7
    if (dy >= -1.0f && dy <= 11.5f) {
        float lt = clampf(dy / 10.0f, 0.0f, 1.0f);
        float acx = j->cx + side * (5.5f + lt * 3.8f) + sinf(j->t * 4.0f + side) * 1.2f * lt;
        float d2 = (px_x - acx) * (px_x - acx) + (dy - 9.5f) * (dy - 9.5f);
        if (d2 <= 4.2f) { *col = d2 <= 1.5f ? C_WHITE : C_CYAN; return true; }
        if (dy < 9.5f && fabsf(px_x - acx) <= 1.1f) { *col = C_BL; return true; }
    }
#endif
    return false;
}

static bool check_wings(const avatar_t *j, float px_x, float px_y, uint8_t *col, int x, int y)
{
#if DNA_WINGS > 0
    float sh_y = j->cy + 1.0f;
    float dx_abs = fabsf(px_x - j->cx);
    float start_x = j->a * 0.78f;
    if (dx_abs < start_x - 1.0f || dx_abs > start_x + 12.5f) return false;
    float wt = clampf((dx_abs - start_x) / 11.0f, 0.0f, 1.0f);
    float flap_dy = j->wing_flap * 4.5f * wt;
#if DNA_WINGS == 1
    float top_arch = sh_y - 4.0f - sinf(wt * 2.5f) * 4.5f - flap_dy;
    float bot_arch = sh_y + 5.5f - wt * 2.0f - fabsf(sinf(wt * 3.14159f * 2.0f)) * 2.2f - flap_dy * 0.7f;
    if (px_y >= top_arch && px_y <= bot_arch) {
        *col = px_y <= top_arch + 1.8f ? C_BL : (bayer(x, y) < 0.45f ? C_BLUSHD : C_TONGUE);
        return true;
    }
#elif DNA_WINGS == 2
    float top_arch = sh_y - 6.0f - sinf(wt * 2.8f) * 5.0f - flap_dy;
    float bot_arch = sh_y + 6.0f - cosf(wt * 1.5f) * 3.0f - flap_dy * 0.5f;
    if (px_y >= top_arch && px_y <= bot_arch) {
        *col = (((x + y) & 1) == 0) ? C_CYAN : C_SKINL;
        return true;
    }
#endif
#endif
    (void)j; (void)px_x; (void)px_y; (void)col; (void)x; (void)y;
    return false;
}

static bool check_tail(const avatar_t *j, float px_x, float px_y, uint8_t *col, int x, int y)
{
#if DNA_TAIL > 0
    float base_x = j->cx + j->a * 0.52f, base_y = j->cy + j->b * 0.58f;
    float dx = px_x - base_x, dy = base_y - px_y;
    if (dx < -2.0f || dx > 16.5f || dy < -4.5f || dy > 18.0f) return false;
    float wag = sinf(j->t * j->tail_speed) * 2.2f;
    float t_est = clampf((dx * 0.66f + dy * 0.74f) / 16.0f, 0.0f, 1.0f);
    float cx_t = t_est * 11.5f + sinf(t_est * 3.1f) * 2.0f;
    float cy_t = t_est * t_est * 12.0f + wag * t_est;
    float dist2 = (dx - cx_t) * (dx - cx_t) + (dy - cy_t) * (dy - cy_t);
#if DNA_TAIL == 1
    float r = 5.2f * sinf(clampf(t_est * 2.6f + 0.25f, 0.0f, 3.05f));
    if (dist2 <= r * r) {
        float b = bayer(x, y);
        *col = (t_est > 0.62f + (b - 0.5f) * 0.14f) ? ((t_est > 0.84f && b < 0.5f) ? C_CYAN : C_SKINL) : (dy > cy_t + 1.0f ? C_BL : C_BM);
        return true;
    }
#elif DNA_TAIL == 2
    float r = t_est < 0.75f ? 3.8f * (1.0f - t_est * 0.65f) : 3.6f * sinf((1.0f - t_est) * 2.0f * 3.14159f + 0.2f);
    if (dist2 <= r * r) {
        *col = t_est > 0.72f ? (dist2 < r * r * 0.4f ? C_WHITE : C_CYAN) : (dy > cy_t ? C_BL : C_BM);
        return true;
    }
#elif DNA_TAIL == 3
    float fin_r = 4.8f * sinf(t_est * 3.14159f * 0.88f + 0.2f);
    float core_r = 2.0f * (1.0f - t_est * 0.75f);
    if (dist2 <= fin_r * fin_r) {
        *col = dist2 <= core_r * core_r ? C_BM : ((((x + y) & 1) == 0) ? C_CYAN : C_BL);
        return true;
    }
#endif
#endif
    (void)j; (void)px_x; (void)px_y; (void)col; (void)x; (void)y;
    return false;
}

static void draw_avatar(const avatar_t *j, const limb_t arms[2], const limb_t feet[2])
{
    memset(s_mask, 0, sizeof(s_mask));
    limb_q_t arm_q[2], foot_q[2];
    for (int i = 0; i < 2; i++) {
        limb_setup(&arms[i], 2.8f, 5.2f, &arm_q[i]);
        limb_setup(&feet[i], 4.2f, 2.6f, &foot_q[i]);
    }
    int ox = iround(j->cx), oy = iround(j->cy);
    int32_t cx = QF(j->cx);

    for (int y = 0; y < H; y++) {
        row_t row;
        row_setup(j, y + 0.5f, &row);
        int32_t fy = y * ONE + ONE / 2;
        for (int x = 0; x < W; x++) {
            int32_t fx = x * ONE + ONE / 2, lx, ly;
            bool arm = false;
            for (int a = 0; a < 2 && !arm; a++) {
                if (in_limb(&arm_q[a], fx, fy, &lx, &ly)) {
                    s_mask[y * W + x] = M_ARM;
                    int32_t nx = ((lx * QF(0.85f)) >> Q) + (a ? QF(0.20f) : -QF(0.20f));
                    px(x, y, shade_skin(nx, (ly * QF(0.8f)) >> Q, x, y, ox, oy, false));
                    arm = true;
                }
            }
            if (arm) continue;

            uint8_t c_col = C_CYAN;
            if (check_crown(j, x + 0.5f, y + 0.5f, &c_col)) {
                s_mask[y * W + x] = M_EAR; px(x, y, c_col); continue;
            }
#if DNA_EARS != 3
            if (check_ears(j, x + 0.5f, y + 0.5f, &c_col, x, y)) {
                s_mask[y * W + x] = M_EAR; px(x, y, c_col); continue;
            }
#endif
            int32_t ux, uy = row.v;
            int32_t v = body_field(&row, fx - cx, &ux);
            int32_t tuft = ((hash16(x - ox, y - oy) - 32768) * QF(0.16f)) >> 16;
            if (v <= ONE + tuft) {
                float fux = (float)ux / ONE, fuy = (float)uy / ONE;
                bool is_cream = false;
#if DNA_BELLY == 1
                float fu = (x + 0.5f - j->fx) / j->fa, fv = (y + 0.5f - j->fy) / j->fb;
                if (fu * fu * fu * fu + fv * fv * fv * fv <= 1.0f) {
                    s_mask[y * W + x] = M_FACE;
                    px(x, y, fv < -0.55f ? C_SKIND : C_SKIN);
                    continue;
                }
#elif DNA_BELLY == 2
                bool cheek = (fuy > -0.28f && fuy < 0.08f && fabsf(fux) < 0.78f && fuy > -0.05f - 0.22f * cosf(fux * 3.5f));
                bool bib = (fuy >= 0.08f && fuy < 0.85f && fabsf(fux) < 0.52f * (1.0f - (fuy - 0.08f) * 0.65f));
                is_cream = cheek || bib;
#elif DNA_BELLY == 3 || DNA_BELLY == 5
                is_cream = (fuy >= 0.08f && fuy < 0.86f && fabsf(fux) < 0.55f * (1.0f - (fuy - 0.45f) * (fuy - 0.45f) * 0.9f));
#elif DNA_BELLY == 4
                float dl = (fux + 0.30f) * (fux + 0.30f) * 2.1f + (fuy + 0.22f) * (fuy + 0.22f) * 3.8f;
                float dr = (fux - 0.30f) * (fux - 0.30f) * 2.1f + (fuy + 0.22f) * (fuy + 0.22f) * 3.8f;
                bool breast = (fuy >= 0.08f && fuy < 0.86f && fabsf(fux) < 0.58f * (1.0f - (fuy - 0.42f) * (fuy - 0.42f) * 1.1f));
                is_cream = (dl <= 0.42f || dr <= 0.42f || breast);
#endif
                (void)fux; (void)fuy;
                s_mask[y * W + x] = M_BODY;
                px(x, y, shade_skin((ux * QF(0.95f)) >> Q, (uy * QF(0.95f)) >> Q, x, y, ox, oy, is_cream));
                continue;
            }
#if DNA_EARS == 3
            if (check_ears(j, x + 0.5f, y + 0.5f, &c_col, x, y)) {
                s_mask[y * W + x] = M_GILL; px(x, y, c_col); continue;
            }
#endif
            bool foot = false;
            for (int f = 0; f < 2; f++) {
                if (in_limb(&foot_q[f], fx, fy, &lx, &ly)) {
                    s_mask[y * W + x] = M_FOOT;
                    px(x, y, ly < -QF(0.15f) ? C_BL : C_BD);
                    foot = true; break;
                }
            }
            if (foot) continue;

            if (check_wings(j, x + 0.5f, y + 0.5f, &c_col, x, y)) {
                s_mask[y * W + x] = M_WING; px(x, y, c_col); continue;
            }
            if (check_tail(j, x + 0.5f, y + 0.5f, &c_col, x, y)) {
                s_mask[y * W + x] = M_TAIL; px(x, y, c_col);
            }
        }
    }

    static const int8_t N4[4][2] = { { 1, 0 }, { -1, 0 }, { 0, 1 }, { 0, -1 } };
    for (int y = 0; y < H; y++) {
        for (int x = 0; x < W; x++) {
            uint8_t m = s_mask[y * W + x];
            if (m == M_NONE || m == M_FACE) continue;
            for (int k = 0; k < 4; k++) {
                int xx = x + N4[k][0], yy = y + N4[k][1];
                uint8_t n = ((unsigned)xx < W && (unsigned)yy < H) ? s_mask[yy * W + xx] : M_NONE;
                if (n == M_NONE || (m == M_ARM && (n == M_BODY || n == M_FACE)) || (m == M_BODY && n == M_FOOT)) {
                    px(x, y, m == M_GILL ? C_OUT2 : C_OUT);
                    break;
                }
            }
        }
    }
#if DNA_CROWN == 1
    int gx = iround(j->fx), gy = iround(j->cy - j->b - 2.0f + sinf(j->t * 3.0f) * 0.6f);
    px(gx, gy - 1, C_CYAN);
    px(gx - 1, gy, C_CYAN); px(gx, gy, C_WHITE); px(gx + 1, gy, C_CYAN);
    px(gx, gy + 1, C_CYAN);
#endif
}

typedef enum { EYES_NORMAL, EYES_WIDE, EYES_HAPPY, EYES_X, EYES_HEART, EYES_ANGRY } eye_style_t;

static void draw_eye(float ex, float ey, float openness, eye_style_t style, float gx, float gy)
{
    int cx = iround(ex), cy = iround(ey);
    if (style == EYES_HAPPY) {
        static const char *const HAPPY[] = { ".####.", "##..##", "#....#" };
        stamp(HAPPY, 3, cx - 3, cy - 1, C_IRIS, C_IRIS); return;
    }
    if (style == EYES_X) {
        static const char *const XS[] = { "#...#", ".#.#.", "..#..", ".#.#.", "#...#" };
        stamp(XS, 5, cx - 2, cy - 2, C_IRIS, C_IRIS); return;
    }
    if (style == EYES_HEART) {
        static const char *const HEART_EYE[] = { ".##.##.", "#######", "#o#####", ".#####.", "..###..", "...#..." };
        stamp(HEART_EYE, 6, cx - 3, cy - 3, C_HEART, C_WHITE); return;
    }
    if (openness < 0.25f) {
        static const char *const SHUT[] = { ".####.", "#....#" };
        stamp(SHUT, 2, cx - 3, cy + 1, C_IRIS, C_IRIS); return;
    }
#if DNA_EYES == 4
    static const char *const BEAD[] = { ".##.", "#o##", "####", ".##." };
    stamp(BEAD, 4, iround(ex + gx * 0.8f) - 2, iround(ey + gy * 0.7f) - 2, C_IRIS, C_SHINE);
    return;
#else
    int rx = (DNA_EYES == 3) ? 3 : 4;
    int ry = (style == EYES_WIDE ? rx + 1 : rx);
    int eff_ry = iround(ry * clampf(openness, 0.3f, 1.0f));
    if (eff_ry < 1) eff_ry = 1;
    float px_off = gx * 1.0f, py_off = gy * 0.8f;

    for (int dy = -eff_ry; dy <= eff_ry; dy++) {
        if (style == EYES_ANGRY && dy < -1) continue;
        for (int dx = -rx; dx <= rx; dx++) {
            float nd = (dx * dx) / ((float)rx * rx + 0.5f) + (dy * dy) / ((float)eff_ry * eff_ry + 0.5f);
            if (nd > 1.0f) continue;
            float id_x = dx - px_off, id_y = dy - py_off;
            uint8_t col = C_WHITE;
#if DNA_EYES == 1
            float pupil_d = (id_x * id_x) * 1.8f + (id_y * id_y) * 0.55f;
            float iris_d = id_x * id_x + id_y * id_y;
            if (pupil_d <= 3.2f) col = C_IRIS;
            else if (iris_d <= 9.2f) col = (dy > 0 && bayer(cx + dx, cy + dy) < 0.45f) ? C_SKINL : C_IRIS_R;
#elif DNA_EYES == 2
            float id2 = id_x * id_x + id_y * id_y;
            col = nd > 0.82f ? C_OUT : (id2 <= 4.2f ? C_IRIS : C_IRIS_R);
#elif DNA_EYES == 3
            (void)id_x; (void)id_y;
            col = (dy > 0 && nd > 0.52f && bayer(cx + dx, cy + dy) < 0.65f) ? C_IRIS_R : C_IRIS;
#else
            float id2 = id_x * id_x + id_y * id_y;
            if (id2 <= 3.6f) col = C_IRIS;
            else if (id2 <= 8.5f) col = (dy > 0 && bayer(cx + dx, cy + dy) < 0.45f) ? C_CYAN : C_IRIS_R;
#endif
            px(cx + dx, cy + dy, col);
        }
    }
    int sx = cx + iround(px_off * 0.5f) - 1, sy = cy + iround(py_off * 0.5f) - 1;
    px(sx, sy, C_SHINE); px(sx - 1, sy, C_SHINE); px(sx, sy - 1, C_SHINE);
    if (eff_ry >= 3) px(sx + 2, sy + 2, C_CYAN);
#endif
}

static void draw_blush(int x, int y, float strength)
{
    static const char *const CHEEK[] = { ".##.", "####", ".##." };
    for (int j = 0; j < 3; j++) {
        for (int i = 0; i < 4; i++) {
            if (CHEEK[j][i] != '#') continue;
            float b = bayer(x + i, y + j);
            if (b < strength) px(x - 2 + i, y + j, (j == 1 && b < strength * 0.5f) ? C_BLUSHD : C_BLUSH);
        }
    }
}

typedef enum { MOUTH_SMILE, MOUTH_O, MOUTH_HMM, MOUTH_TALK, MOUTH_GRIN, MOUTH_FLAT, MOUTH_POUT } mouth_t;

static void draw_mouth(int x, int y, mouth_t m, float open)
{
#if DNA_MOUTH == 3
    px(x, y - 2, C_CYAN);
    px(x - 1, y - 1, C_CYAND); px(x, y - 1, C_CYAN); px(x + 1, y - 1, C_CYAND);
    px(x, y, C_CYAND);
    if (m == MOUTH_O || m == MOUTH_TALK || m == MOUTH_GRIN) {
        px(x - 1, y + 1, C_MOUTH); px(x, y + 1, C_TONGUE); px(x + 1, y + 1, C_MOUTH);
    }
    (void)open;
    return;
#else
#if DNA_MOUTH == 1
    px(x - 1, y - 2, C_MOUTH); px(x, y - 2, C_MOUTH); px(x + 1, y - 2, C_MOUTH); px(x, y - 1, C_MOUTH);
#elif DNA_MOUTH == 2
    px(x - 2, y - 2, C_MOUTH); px(x + 2, y - 2, C_MOUTH);
#endif
    switch (m) {
    case MOUTH_SMILE: {
#if DNA_MOUTH == 1
        static const char *const S[] = { "#.#.#", ".#.#." };
        stamp(S, 2, x - 2, y, C_MOUTH, C_MOUTH);
#elif DNA_MOUTH == 2
        static const char *const S[] = { "#....#", ".#o##." };
        stamp(S, 2, x - 3, y, C_MOUTH, C_WHITE);
#else
        static const char *const S[] = { "#....#", "######", ".#oo#.", "..##.." };
        stamp(S, 4, x - 3, y, C_MOUTH, C_TONGUE);
#endif
        break;
    }
    case MOUTH_O: {
        static const char *const S[] = { ".##.", "#oo#", ".##." };
        stamp(S, 3, x - 2, y, C_MOUTH, C_TONGUE); break;
    }
    case MOUTH_HMM: {
        static const char *const S[] = { "..#", "##." };
        stamp(S, 2, x - 1, y + 1, C_MOUTH, C_MOUTH); break;
    }
    case MOUTH_TALK: {
        int h = 2 + iround(clampf(open, 0, 1) * 3.0f);
        int w = h > 2 ? 6 : 4;
        for (int j = 0; j < h; j++) {
            int inset = (j == h - 1) ? 1 : 0;
            for (int i = inset; i < w - inset; i++) {
                bool tongue = h >= 3 && j >= h - 2 && i > inset && i < w - inset - 1;
                px(x - w / 2 + i, y + j, tongue ? C_TONGUE : C_MOUTH);
            }
        }
        break;
    }
    case MOUTH_GRIN: {
        static const char *const S[] = { "#######", ".##o##.", "..ooo..", "...#..." };
        stamp(S, 4, x - 3, y, C_MOUTH, C_TONGUE); break;
    }
    case MOUTH_FLAT: {
        static const char *const S[] = { "####" };
        stamp(S, 1, x - 2, y + 1, C_MOUTH, C_MOUTH); break;
    }
    case MOUTH_POUT: {
        static const char *const S[] = { ".####.", "#....#" };
        stamp(S, 2, x - 3, y + 1, C_MOUTH, C_MOUTH); break;
    }
    }
#endif
}

static void draw_sparkles(const sim_pose_t *p, float cx, float cy, bool front, float speed, int count)
{
    for (int i = 0; i < count; i++) {
        float a = p->t * speed + i * TAU / count, s = sinf(a);
        if ((s > 0) != front) continue;
        float rr = 25.0f + 2.0f * sinf(i * 1.9f + p->t * 0.7f);
        int x = iround(cx + cosf(a) * rr), y = iround(cy - 3 + s * rr * 0.42f);
        float tw = 0.5f + 0.5f * sinf(p->t * 5.0f + i * 1.7f);
        uint8_t arm = front ? C_ACC : C_AURA2, core = front ? C_WHITE : C_SPK;
        if (tw > 0.8f) {
            px(x, y, core);
            for (int k = 1; k <= 2; k++) {
                uint8_t c = k == 1 ? (front ? C_SPK : arm) : arm;
                px(x + k, y, c); px(x - k, y, c); px(x, y + k, c); px(x, y - k, c);
            }
        } else if (tw > 0.45f) {
            px(x, y, front ? C_SPK : arm);
            px(x + 1, y, arm); px(x - 1, y, arm); px(x, y + 1, arm); px(x, y - 1, arm);
        } else if (tw > 0.15f) px(x, y, arm);
    }
}

static void draw_waves(float cx, float cy, float body_rx, float level, float t)
{
    int n = 1 + (int)(clampf(level, 0, 1) * 3.2f);
    if (n > 3) n = 3;
    for (int k = 0; k < n; k++) {
        float r = body_rx + 5.0f + k * 3.0f, flick = 0.5f + 0.5f * sinf(t * 12.0f - k * 1.4f);
        int span = 2 + k;
        for (int side = -1; side <= 1; side += 2) {
            for (int j = -span; j <= span; j++) {
                int x = iround(cx + side * (r - (float)(j * j) / (2.0f * r) * 3.0f)), y = iround(cy - 2 + j);
                if (k == 0 || bayer(x, y) < 0.35f + flick * 0.65f)
                    px(x, y, k == 0 ? C_ACC : (k == 1 ? C_G1 : C_G2));
            }
        }
    }
}

static void draw_thought_dots(float x, float y, float t)
{
    int active = (int)(fracf(t * 1.6f) * 3.0f);
    for (int i = 0; i < 3; i++) {
        int bx = iround(x + i * 4), by = iround(y - i * 3) - (i == active ? 1 : 0);
        uint8_t c = i == active ? C_G0 : C_ACC;
        px(bx, by, c); px(bx + 1, by, c); px(bx, by + 1, c); px(bx + 1, by + 1, i == active ? C_G1 : C_G2);
    }
}

static void draw_hearts(float cx, float top, float t, float amount)
{
    static const char *const HEART[] = { ".#.#.", "#o###", "#####", ".###.", "..#.." };
    for (int i = 0; i < 2; i++) {
        float ph = fracf(t * 0.9f + i * 0.5f);
        if (ph > amount) continue;
        stamp(HEART, 5, iround(cx + (i ? 13 : -18) + sinf(ph * TAU + i) * 2), iround(top - ph * 10), C_HEART, C_WHITE);
    }
}

static void draw_zzz(float cx, float top, float t)
{
    static const char *const Z_BMP[] = { "####", "..#.", ".#..", "####" };
    for (int i = 0; i < 2; i++) {
        float ph = fracf(t * 0.45f + i * 0.5f);
        stamp(Z_BMP, 4, iround(cx + 12 + ph * 6 + sinf(ph * TAU) * 1.5f), iround(top + 4 - ph * 10), i == 0 ? C_G0 : C_ACC, C_WHITE);
    }
}

#define MAP_MAX 512
static uint8_t s_map[MAP_MAX];
static int s_size;

void sim_pixel_set_size(int px_size)
{
    s_size = px_size < MAP_MAX ? px_size : MAP_MAX;
    bool grid = s_size >= 3 * W;
    for (int i = 0; i < s_size; i++) {
        int cell = i * W / s_size;
        bool edge = grid && (i + 1) * W / s_size != cell;
        s_map[i] = (uint8_t)(cell | (edge ? 0x80 : 0));
    }
}

void sim_pixel_scale(uint16_t *dst, int stride_px, int x0, int x1, int y0, int y1)
{
    int n = x1 - x0 + 1;
    const uint8_t *xmap = &s_map[x0];
    const uint16_t *prev = NULL;
    uint8_t prev_m = 0;
    for (int y = y0; y <= y1; y++, dst += stride_px) {
        uint8_t m = s_map[y];
        if (prev && m == prev_m) { memcpy(dst, prev, n * sizeof(uint16_t)); continue; }
        const uint8_t *row = &s_fb[(m & 0x7f) * W];
        if (m & 0x80) {
            for (int i = 0; i < n; i++) dst[i] = s_pal_dim[row[xmap[i] & 0x7f]];
        } else {
            for (int i = 0; i < n; i++) {
                uint8_t xm = xmap[i], c = row[xm & 0x7f];
                dst[i] = xm & 0x80 ? s_pal_dim[c] : s_pal[c];
            }
        }
        prev = dst; prev_m = m;
    }
}

void sim_pixel_render(const sim_pose_t *p)
{
    static bool s_luts;
    if (!s_luts) { init_luts(); s_luts = true; }
    float dt = s_eyes.last_t > 0 ? clampf(p->t - s_eyes.last_t, 0, 0.2f) : 0.04f;
    s_eyes.last_t = p->t;

    sim_mode_t mode = p->mode;
    float fade = mode == SIM_MODE_OFF ? clampf(1.0f - p->mode_t / 1.3f, 0, 1) : 1.0f;
    float happy = p->happy, level = p->level, t = p->t;

    update_palette(&SCHEMES[mode], dt);
    float blink = eyes_update(p, dt);
    memset(s_fb, C_BG, sizeof(s_fb));

    float bob = sinf(t * 1.8f) * 1.0f, breathe_rate = 2.0f, lean = 0, hop = 0;
    float perk = 0.0f, tail_speed = 2.8f, wing_flap = sinf(t * 3.6f) * 0.35f;

    switch (mode) {
    case SIM_MODE_LISTENING: bob = sinf(t * 3.0f) * 0.6f; perk = 0.85f; tail_speed = 3.5f; wing_flap = 0.55f + sinf(t * 5.0f) * 0.2f; break;
    case SIM_MODE_THINKING:  bob = sinf(t * 2.4f) * 0.8f; lean = sinf(t * 1.3f) * 1.2f; perk = -0.25f; tail_speed = 1.6f; break;
    case SIM_MODE_SPEAKING:  bob = sinf(t * 5.0f) * 0.6f - level * 1.5f; perk = 0.45f * sinf(t * 6.5f); tail_speed = 4.8f; wing_flap = sinf(t * 8.0f) * (0.4f + level * 0.5f); break;
    case SIM_MODE_ERROR:     bob = 1.0f; lean = sinf(t * 18.0f) * (p->mode_t < 0.6f ? 1.0f : 0.0f); perk = -0.9f; tail_speed = 0.8f; wing_flap = -0.8f; break;
    case SIM_MODE_SLEEPY:    breathe_rate = 0.9f; bob = sinf(t * 0.9f) * 1.2f + 1.5f; lean = sinf(t * 0.6f) * 1.0f; perk = -0.8f; tail_speed = 0.9f; wing_flap = -0.75f; break;
    case SIM_MODE_LOVE:      bob = sinf(t * 3.5f) * 0.8f; lean = sinf(t * 2.5f) * 1.8f; perk = 0.65f; tail_speed = 6.5f; wing_flap = sinf(t * 12.0f) * 0.75f; break;
    case SIM_MODE_ANGRY:     bob = 1.2f; lean = sinf(t * 28.0f) * 0.8f; perk = -0.65f; tail_speed = 8.0f; wing_flap = 0.9f; break;
    case SIM_MODE_SURPRISED: hop = p->mode_t < 0.35f ? sinf((p->mode_t / 0.35f) * 3.1416f) * 6.0f : 0.0f; bob = 0.0f; perk = 1.0f; tail_speed = 5.5f; wing_flap = 1.0f; break;
    default: break;
    }
    if (happy > 0) { hop = fabsf(sinf(t * 9.0f)) * 3.0f * happy; perk = 0.8f; tail_speed = 7.5f; wing_flap = sinf(t * 14.0f) * 0.85f; }

    float boot = mode == SIM_MODE_BOOT ? clampf(p->mode_t / 1.4f, 0, 1) : 1.0f;
    float pop = mode == SIM_MODE_BOOT ? clampf(p->mode_t / 0.6f, 0, 1) : 1.0f;
    float squash = 1.0f - (1.0f - pop) * 0.35f + sinf(pop * 3.1416f) * 0.06f;
    float breathe = sinf(t * breathe_rate + 1.0f) * 0.03f;

    avatar_t j;
    j.a = DNA_BODY_RX * (1 + breathe) * (2.0f - squash) + level * 0.8f;
    j.b = DNA_BODY_RY * (1 - breathe) * squash;
    j.cx = (DNA_TAIL > 0 ? 30.8f : 32.0f) + lean;
    j.cy = 55.5f - j.b + bob * 0.5f - hop;
    j.fa = j.a * 0.76f;
    j.fb = 7.3f * squash;
    j.fx = j.cx + lean * 0.3f;
    j.fy = j.cy - j.b * 0.22f + bob * 0.3f;
    j.t = t; j.perk = perk; j.tail_speed = tail_speed; j.wing_flap = wing_flap;

    draw_aura(j.cx, j.cy - 3, 29.0f + level * 4.0f + sinf(t * 1.5f), (0.75f * boot + level * 0.4f) * fade);
    if (mode == SIM_MODE_LISTENING || mode == SIM_MODE_SPEAKING)
        draw_rings(j.cx, j.fy + 2, t, level, mode == SIM_MODE_LISTENING ? 0.9f : 0.6f);
    draw_shadow(j.cx, 58.5f, 13.0f - hop * 0.8f);

    float spk_speed = mode == SIM_MODE_THINKING ? 2.8f : mode == SIM_MODE_LISTENING ? 1.2f : mode == SIM_MODE_SPEAKING ? 1.5f : 0.6f;
    int spk_count = mode == SIM_MODE_BOOT ? (int)(boot * 6) : (int)(6 * fade);
    draw_sparkles(p, j.cx, j.cy, false, spk_speed, spk_count);

    float base = j.cy + j.b, step = mode == SIM_MODE_SPEAKING ? sinf(t * 5.0f) * 0.6f : 0.0f;
    limb_t feet[2] = {
        { j.cx - 5.8f, base + 0.5f + (happy > 0 ? hop * 0.3f : step), -0.15f },
        { j.cx + 5.8f, base + 0.5f + (happy > 0 ? hop * 0.3f : -step), 0.15f }
    };
    limb_t arms[2];
    float adx = j.a - 0.5f, ay = j.cy + 3.0f;
    switch (mode) {
    case SIM_MODE_LISTENING: arms[0] = (limb_t){ j.cx - adx + 1.0f, j.fy + 5.0f, 0.55f }; arms[1] = (limb_t){ j.cx + adx - 1.0f, j.fy + 5.0f, -0.55f }; break;
    case SIM_MODE_THINKING:  arms[0] = (limb_t){ j.cx - adx, ay, -0.35f }; arms[1] = (limb_t){ j.cx + 7.5f, j.fy + j.fb + 3.5f, -1.1f }; break;
    case SIM_MODE_OFF: { float w = sinf(t * 12.0f) * 0.35f * fade; arms[0] = (limb_t){ j.cx - adx, ay, -0.3f }; arms[1] = (limb_t){ j.cx + adx + 1.0f, j.cy - 4.0f, -2.3f - w }; break; }
    case SIM_MODE_SPEAKING: { float w = sinf(t * 7.0f) * (0.25f + level * 0.45f); arms[0] = (limb_t){ j.cx - adx, ay - 1.0f, -0.4f - w }; arms[1] = (limb_t){ j.cx + adx, ay - 1.0f, 0.4f - w }; break; }
    case SIM_MODE_LOVE: { float w = sinf(t * 6.0f) * 0.15f; arms[0] = (limb_t){ j.cx - adx + 2.0f, j.fy + 6.5f, 0.75f + w }; arms[1] = (limb_t){ j.cx + adx - 2.0f, j.fy + 6.5f, -0.75f - w }; break; }
    case SIM_MODE_ANGRY: { float w = sinf(t * 24.0f) * 0.15f; arms[0] = (limb_t){ j.cx - adx - 1.0f, ay - 1.5f, -0.85f + w }; arms[1] = (limb_t){ j.cx + adx + 1.0f, ay - 1.5f, 0.85f - w }; break; }
    case SIM_MODE_SURPRISED: arms[0] = (limb_t){ j.cx - adx - 1.2f, j.cy - 3.5f, 2.2f }; arms[1] = (limb_t){ j.cx + adx + 1.2f, j.cy - 3.5f, -2.2f }; break;
    default: {
        float sway = sinf(t * 1.8f + 0.6f) * 0.08f;
        if (happy > 0) {
            float wig = sinf(t * 14.0f) * 0.25f;
            arms[0] = (limb_t){ j.cx - adx - 1.0f, j.cy - 4.0f, 2.4f + wig };
            arms[1] = (limb_t){ j.cx + adx + 1.0f, j.cy - 4.0f, -2.4f - wig };
        } else {
            arms[0] = (limb_t){ j.cx - adx, ay, -0.3f + sway };
            arms[1] = (limb_t){ j.cx + adx, ay, 0.3f - sway };
        }
        break;
    }
    }
    draw_avatar(&j, arms, feet);

    float eye_y = j.fy - 0.5f, eye_dx = 5.4f, open = 1.0f - blink, mouth_open = 0;
    eye_style_t style = EYES_NORMAL;
    mouth_t mouth = MOUTH_SMILE;
    switch (mode) {
    case SIM_MODE_BOOT:      open = p->mode_t < 0.9f ? 0.0f : clampf((p->mode_t - 0.9f) / 0.3f, 0, 1); break;
    case SIM_MODE_LISTENING: style = EYES_WIDE; mouth = MOUTH_O; break;
    case SIM_MODE_THINKING:  open *= 0.85f; mouth = MOUTH_HMM; break;
    case SIM_MODE_SPEAKING:  mouth = MOUTH_TALK; mouth_open = level * 1.3f + 0.1f * (0.5f + 0.5f * sinf(t * 22.0f)); break;
    case SIM_MODE_ERROR:     style = EYES_X; mouth = MOUTH_FLAT; break;
    case SIM_MODE_OFF:       open = clampf((1.0f - p->mode_t / 1.0f) * 1.5f, 0, 1); mouth = MOUTH_SMILE; break;
    case SIM_MODE_SLEEPY:    open *= 0.20f; mouth = MOUTH_O; break;
    case SIM_MODE_LOVE:      style = EYES_HEART; mouth = MOUTH_GRIN; break;
    case SIM_MODE_ANGRY:     style = EYES_ANGRY; open *= 0.85f; mouth = MOUTH_POUT; break;
    case SIM_MODE_SURPRISED: style = EYES_WIDE; mouth = MOUTH_O; break;
    default: break;
    }
    if (happy > 0.2f && mode != SIM_MODE_ERROR) { style = EYES_HAPPY; mouth = MOUTH_GRIN; }

    draw_eye(j.fx - eye_dx, eye_y, open, style, s_eyes.gx, s_eyes.gy);
    draw_eye(j.fx + eye_dx, eye_y, open, style, s_eyes.gx, s_eyes.gy);

    int bl = iround(j.fx - eye_dx), br = iround(j.fx + eye_dx);
    int by = iround(eye_y) - 6 - ((mode == SIM_MODE_LISTENING || mode == SIM_MODE_SURPRISED) ? 1 : 0);
    if (mode == SIM_MODE_ANGRY) {
        px(bl - 1, by, C_BROW); px(bl, by + 1, C_BROW); px(bl + 1, by + 2, C_BROW);
        px(br - 1, by + 2, C_BROW); px(br, by + 1, C_BROW); px(br + 1, by, C_BROW);
    } else {
        int lift_r = (mode == SIM_MODE_THINKING) ? -1 : 0;
        px(bl - 1, by, C_BROW); px(bl, by, C_BROW); px(bl + 1, by + 1, C_BROW);
        px(br - 1, by + 1 + lift_r, C_BROW); px(br, by + lift_r, C_BROW); px(br + 1, by + lift_r, C_BROW);
    }

    float blush = 0.60f + happy * 0.40f + (mode == SIM_MODE_LOVE ? 0.35f : (mode == SIM_MODE_SPEAKING ? 0.15f : 0.0f));
    draw_blush(iround(j.fx - 9.5f), iround(eye_y + 3), blush);
    draw_blush(iround(j.fx + 9.5f), iround(eye_y + 3), blush);
    draw_mouth(iround(j.fx), iround(eye_y + 5), mouth, mouth_open);

    draw_sparkles(p, j.cx, j.cy, true, spk_speed, spk_count);

    float top = j.cy - j.b - 10.0f;
    if (mode == SIM_MODE_LISTENING || mode == SIM_MODE_SPEAKING) draw_waves(j.cx, j.fy + 2, j.a, level, t);
    if (mode == SIM_MODE_THINKING) draw_thought_dots(j.cx + 14, top + 4, t);
    if (happy > 0 || mode == SIM_MODE_LOVE) draw_hearts(j.cx, top + 2, t, mode == SIM_MODE_LOVE ? 1.0f : happy);
    if (mode == SIM_MODE_ERROR || (mode == SIM_MODE_SURPRISED && p->mode_t < 0.8f)) {
        static const char *const BANG[] = { ".##.", ".##.", ".##.", ".##.", "....", ".##." };
        stamp(BANG, 6, iround(j.cx + 16), iround(top + 2), C_ACC, C_ACC);
    }
    if (mode == SIM_MODE_SLEEPY) draw_zzz(j.cx, top + 2, t);
    if (mode == SIM_MODE_ANGRY) {
        static const char *const VEIN[] = { ".#.#.", "##.##", ".....", "##.##", ".#.#." };
        stamp(VEIN, 5, iround(j.cx + 12), iround(top + 5) + ((int)(t * 8.0f) & 1), C_HEART, C_ACC);
    }
}
`;
    }

    const PREFIXES = ["Sternen", "Kosmos", "Kristall", "Nebel", "Mond", "Solar", "Äther", "Polar", "Aurora", "Traum"];
    const SPECIES  = ["Wächter", "Geist", "Kobold", "Fuchs", "Drache", "Luchs", "Axolotl", "Kauz", "Faeling", "Astralwesen"];

    const PALETTES = [
      { body: "#f26b38", skin: "#fff0dc", cyan: "#6cf8ec", iris: "#1cd4a8", blush: "#ff7898" }, // Sunset Kitsune
      { body: "#2888b8", skin: "#f8d878", cyan: "#98ffee", iris: "#ffa828", blush: "#ff78a8" }, // Sapphire Dragon

    function randomizeCreature() {
      dna.seed = Math.floor(1000 + Math.random() * 9000);
      const pName = PREFIXES[Math.floor(Math.random() * PREFIXES.length)];
      const sName = SPECIES[Math.floor(Math.random() * SPECIES.length)];
      dna.name = `${pName}-${sName} #${dna.seed}`;

      dna.ears     = Math.floor(Math.random() * 8);
      dna.crown    = Math.floor(Math.random() * 5);
      dna.wings    = Math.floor(Math.random() * 3);
      dna.tail     = Math.floor(Math.random() * 4);
      dna.belly    = Math.floor(Math.random() * 6);
      dna.eyes     = Math.floor(Math.random() * 5);
      dna.mouth    = Math.floor(Math.random() * 4);
      dna.particle = Math.floor(Math.random() * 3);

      const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      dna.bodyHex  = pal.body;
      dna.skinHex  = pal.skin;
      dna.cyanHex  = pal.cyan;
      dna.irisHex  = pal.iris;
      dna.blushHex = pal.blush;

      dna.bodyRx     = 13.8 + Math.random() * 2.0;
      dna.bodyRy     = 17.5 + Math.random() * 2.5;
      dna.headWiden  = 0.08 + Math.random() * 0.16;
      dna.neckPinch  = 0.08 + Math.random() * 0.16;
      dna.bellyBulge = 0.06 + Math.random() * 0.14;

      syncUIFromDNA();
    }

    function syncUIFromDNA() {
      document.getElementById("creatureNameBadge").textContent = dna.name;
      document.getElementById("seedDisplay").textContent = `Seed: 0x${dna.seed.toString(16).toUpperCase()}`;
      document.getElementById("selEars").value     = String(dna.ears);
      document.getElementById("selCrown").value    = String(dna.crown);
      document.getElementById("selWings").value    = String(dna.wings);
      document.getElementById("selTail").value     = String(dna.tail);
      document.getElementById("selBelly").value    = String(dna.belly);
      document.getElementById("selEyes").value     = String(dna.eyes);
      document.getElementById("selMouth").value    = String(dna.mouth);
      document.getElementById("selParticle").value = String(dna.particle);

      document.getElementById("colBody").value = dna.bodyHex;
      document.getElementById("colSkin").value = dna.skinHex;
      document.getElementById("colCyan").value = dna.cyanHex;
      document.getElementById("colIris").value = dna.irisHex;

      document.getElementById("codeOutput").value = generateCCode();
    }

    function bindInputs() {
      const bindSel = (id, key) => {
        document.getElementById(id).addEventListener("change", e => {
          dna[key] = parseInt(e.target.value, 10);
          document.getElementById("codeOutput").value = generateCCode();
        });
      };
      bindSel("selEars", "ears");
      bindSel("selCrown", "crown");
      bindSel("selWings", "wings");
      bindSel("selTail", "tail");
      bindSel("selBelly", "belly");
      bindSel("selEyes", "eyes");
      bindSel("selMouth", "mouth");
      bindSel("selParticle", "particle");

      const bindCol = (id, key) => {
        document.getElementById(id).addEventListener("input", e => {
          dna[key] = e.target.value;
          document.getElementById("codeOutput").value = generateCCode();
        });
      };
      bindCol("colBody", "bodyHex");
      bindCol("colSkin", "skinHex");
      bindCol("colCyan", "cyanHex");
      bindCol("colIris", "irisHex");

      document.getElementById("btnRandom").addEventListener("click", randomizeCreature);
      document.getElementById("btnPet").addEventListener("click", () => { happy_t = t; });

      document.getElementById("rngLevel").addEventListener("input", e => {
        const v = parseFloat(e.target.value);
        document.getElementById("lblAutoTalk").textContent = v === 0 ? "Auto" : `${Math.round(v * 100)}%`;
      });

      document.getElementById("btnCopyC").addEventListener("click", () => {
        navigator.clipboard.writeText(document.getElementById("codeOutput").value);
        const btn = document.getElementById("btnCopyC");
        btn.textContent = "✅ Kopiert!";
        setTimeout(() => { btn.textContent = "📋 Code kopieren"; }, 1800);
      });

      document.getElementById("btnDownloadC").addEventListener("click", () => {
        const blob = new Blob([document.getElementById("codeOutput").value], { type: "text/x-csrc" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `sim_pixel_${dna.seed}.c`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // Render Mode Buttons
      const container = document.getElementById("modeButtons");
      MODES.forEach(m => {
        const btn = document.createElement("button");
        btn.className = "mode-btn px-2.5 py-2 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-1";
        btn.textContent = m.label;
        btn.dataset.id = m.id;
        btn.addEventListener("click", () => {
          currentMode = m.id;
          mode_t = 0;
          updateModeButtons();
        });
        container.appendChild(btn);
      });
      updateModeButtons();
    }

    function updateModeButtons() {
      document.querySelectorAll(".mode-btn").forEach(btn => {
        const active = parseInt(btn.dataset.id, 10) === currentMode;
        btn.className = active
          ? "mode-btn px-2.5 py-2 rounded-xl text-xs font-bold border border-cyan-400 bg-cyan-500/20 text-cyan-200 shadow-sm"
          : "mode-btn px-2.5 py-2 rounded-xl text-xs font-medium border border-slate-800 bg-slate-950/70 text-slate-400 hover:bg-slate-800 hover:text-slate-200";
      });
    }

    // Main loop (25 fps = 40ms frame time, matching SI-M hardware)
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;
      renderFrame(dt);
      requestAnimationFrame(loop);
    }

    bindInputs();
    randomizeCreature();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
